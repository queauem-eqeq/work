<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Portfolio · administration</title>
<style>
:root{--f:#0c0c0c;--p:#161616;--t:#2a2a2a;--x:#f1ede4;--g:#9a958c;--r:#e0343f;--v:#3fae6b}
*{box-sizing:border-box}body{margin:0;background:var(--f);color:var(--x);font:15px/1.5 system-ui,Segoe UI,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:1px solid var(--t);padding:7px 13px;cursor:pointer}button:hover{border-color:var(--x)}
button.go{background:var(--r);border-color:var(--r);font-weight:600}button:disabled{opacity:.4;cursor:default}
input,textarea{width:100%;background:var(--p);border:1px solid var(--t);padding:8px 10px}textarea{resize:vertical;min-height:38px}
input:focus,textarea:focus{outline:1px solid var(--r)}
#barre{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:10px 16px;background:#000;border-bottom:1px solid var(--t);flex-wrap:wrap}
#barre b{font-size:16px;margin-right:auto}#etat{color:var(--g);font-size:13px}
#corps{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 52px)}
#menu{border-right:1px solid var(--t);padding:10px 0;overflow:auto;max-height:calc(100vh - 52px);position:sticky;top:52px}
#menu h4{margin:14px 16px 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--g)}
#menu a{display:block;padding:5px 16px;color:var(--x);text-decoration:none;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu a:hover{background:var(--p)}#menu a.on{background:var(--p);border-left:3px solid var(--r);padding-left:13px}#menu a.mod::after{content:" ●";color:var(--r)}
#page{padding:22px 28px 120px;max-width:1100px}
h1{font:400 30px Georgia,serif;margin:0 0 4px}h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--g);margin:28px 0 8px;border-top:1px solid var(--t);padding-top:14px}
label{display:block;font-size:12px;color:var(--g);margin:10px 0 3px}
.ligne{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}.ligne textarea,.ligne input{flex:1}.ligne button{padding:6px 9px;flex:none}

.imgs.sur{border-color:var(--r);background:#1c1012}
.im{position:relative;background:var(--p);cursor:grab}.im img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.im .x{position:absolute;top:3px;right:3px;background:#000c;border:0;width:24px;height:24px;padding:0;line-height:1}.im .x:hover{background:var(--r)}
.im input{font-size:11px;padding:3px 5px;border:0;border-top:1px solid var(--t)}.im.neuf{outline:2px solid var(--v)}.im.dr{opacity:.35}
.depot{color:var(--g);font-size:12px;margin-top:4px}
.bloc{border:1px solid var(--t);padding:12px 14px;margin-bottom:12px;background:#111}.bloc>.tt{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--g);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}.bloc>.tt span{margin-right:auto}

#voile p{color:var(--g);font-size:13px}.err{color:var(--r)}
#journal{white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace;color:var(--g);margin-top:10px}
</style></head><body>
<div id="barre"><b>Portfolio · administration</b><span id="etat"></span>
<button id="bDossier">Choisir le dossier FABLE_SITE</button><button id="bRelire" disabled title="Relit les dossiers de FABLE_SITE et publie ce qui a changé">Publier depuis FABLE_SITE</button><button id="bSave" class="go" disabled>Enregistrer</button></div>
<div id="corps"><div id="menu"></div><div id="page"><p style="color:var(--g)">Choisissez une page à gauche.</p></div></div>
<div id="voile"><div id="acces"></div></div>
<script>
/* Format des pages dans FABLE_SITE : un fichier page.md par page, lisible et modifiable à la main.
   Le même code écrit le fichier (depuis les données du site) et le relit (vers les données du site).
   Utilisé par admin.html dans le navigateur et par les scripts de vérification sous Node. */
(function (racine) {
  "use strict";
  const SEP = " | ";
  const AIDE = "<!-- Fichier de référence de cette page du site. Les lignes « ## » et « Mot : » sont des repères : ne pas les renommer.\n     Une ligne vide sépare deux paragraphes. Une image = une ligne « - nom-du-fichier | légende ». -->";

  // ---------- pages du périmètre ----------
  function pages(D) {
    const L = [{ id: "accueil", t: "Page d'accueil", g: "Général", type: "accueil" }, { id: "apropos", t: "À propos", g: "Général", type: "apropos" }];
    D.focus.forEach(f => L.push({ id: f.id, t: f.t, g: "Focus", type: f.recit ? "recit" : "focus" }));
    for (const k of Object.keys(D.rub)) D.rub[k].items.forEach(o => L.push({ id: o.id, t: o.t, g: D.rub[k].label, type: "fiche", rub: k }));
    D.ia.forEach(o => L.push({ id: o.id, t: o.t, g: "IA et automatisation", type: "ia" }));
    [["affiches", "Affiches"], ["voeux", "Cartes de vœux"], ["infotravaux", "Infos travaux"]].forEach(m => L.push({ id: m[0], t: m[1], g: "Édition : murs d'images", type: "mur" }));
    return L;
  }
  function objet(D, id) {
    if (id === "accueil") return D.accueil;
    if (id === "apropos") return D.apropos;
    return D.focus.find(x => x.id === id) || D.ia.find(x => x.id === id) || Object.values(D.rub).flatMap(r => r.items).find(x => x.id === id) || null;
  }
  const mur = (D, id) => ({ affiches: D.affiches, voeux: D.edition.voeux, infotravaux: D.edition.infotravaux })[id];
  function poseMur(D, id, a) { if (id === "affiches") D.affiches = a; else D.edition[id] = a; }

  // ---------- écriture ----------
  const sec = (nom, corps, ...args) => "## " + [nom, ...args].join(SEP) + "\n" + corps.replace(/\s+$/, "") + "\n";
  const paras = a => (a || []).join("\n\n");
  const puces = a => (a || []).map(x => "- " + x).join("\n");
  const paires = a => (a || []).map(x => "- " + x.join(SEP)).join("\n");

  function ecrire(D, id, nom) {            // nom(idImage) → nom du fichier dans le dossier de la page
    const p = pages(D).find(x => x.id === id); if (!p) throw new Error("Page inconnue : " + id);
    const imgs = a => (a || []).map(x => "- " + nom(x[0]) + (x[3] ? SEP + x[3] : "")).join("\n");
    const S = [], meta = [];
    let titre = p.t;
    if (p.type === "accueil") {
      const A = D.accueil;
      S.push(sec("Métiers", puces(A.metiers)), sec("Phrase d'introduction", A.phrase), sec("Trois colonnes", paires(A.trois)));
      D.heroSets.forEach((h, n) => S.push(sec("Images d'ouverture", imgs(h), String(n + 1))));
    } else if (p.type === "apropos") {
      const A = D.apropos, bl = (nomS, L) => L.forEach(e => S.push(sec(nomS, [e.p || "", puces(e.li), e.note ? "Note : " + e.note : ""].filter(Boolean).join("\n\n"), e.d || "", e.t || "")));
      S.push(sec("Chapô", A.chapo)); bl("Expérience", A.exp); bl("Formation", A.formation);
      S.push(sec("Compétences", puces(A.competences)), sec("Et aussi", puces(A.aussi)));
    } else if (p.type === "mur") {
      S.push(sec("Images", imgs(mur(D, id))));
    } else if (p.type === "fiche") {
      const o = objet(D, id); titre = o.t;
      meta.push(["Date", o.d || ""], ["Personnalités", o.w || ""]);
      S.push(sec("Texte", paras(o.x)), sec("Images", imgs(o.p)));
    } else if (p.type === "ia") {
      const o = objet(D, id); titre = o.t;
      meta.push(["Catégorie", o.k || ""], ["Année", o.d || ""]);
      S.push(sec("Texte", paras(o.x)), sec("Liens", paires(o.liens)), sec("Films", paires(o.films)), sec("Images", imgs(o.p)));
    } else {
      const f = objet(D, id); titre = f.t;
      meta.push(["Bandeau", f.k || ""]);
      S.push(sec("Chapô", f.c || ""), sec("Chiffres clés", paires(f.chiffres)), sec("Image d'ouverture", f.hero ? imgs([f.hero]) : ""));
      if (p.type === "recit") f.recit.forEach(b => {
        if (b.img) S.push(sec("Images", (b.leg ? "Légende : " + b.leg + "\n" : "") + imgs(b.img), b.pg ? "pages" : b.mur ? "mosaïque" : "rangée"));
        else if (b.films) S.push(sec("Films", paires(b.films)));
        else if (b.liens_seuls) S.push(sec("Liens", paires(b.liens_seuls)));
        else {
          S.push(sec(b.liste ? "Puces" : "Texte", b.liste ? puces(b.liste) : paras(b.x), b.n || "", b.k || "", b.d || "", b.h || ""));
          if (b.liens) S.push(sec("Liens du texte", paires(b.liens)));
        }
      });
      else {
        if (f.poeme) S.push(sec("Poème", f.poeme.join("\n")));
        (f.sections || []).forEach(s => S.push(sec("Section", paras(s[1]), s[0])));
        if (f.bandeau) S.push(sec("Images : bandeau", imgs(f.bandeau)));
        if (f.diplomes) S.push(sec("Images : diplômes", imgs(f.diplomes)));
        S.push(sec("Images : galerie", imgs(f.galerie)));
      }
    }
    return "# " + titre + "\n" + AIDE + "\n\n" + meta.map(m => m[0] + " : " + m[1] + "\n").join("") + (meta.length ? "\n" : "") + S.join("\n");
  }

  // ---------- lecture ----------
  function decoupe(texte) {
    const lignes = texte.replace(/^﻿/, "").replace(/\r\n?/g, "\n").replace(/<!--[\s\S]*?-->/g, "").split("\n");
    const doc = { titre: "", meta: {}, sections: [] }; let cour = null;
    for (const l of lignes) {
      if (l.startsWith("## ")) { const a = l.slice(3).split(SEP).map(x => x.trim()); cour = { nom: a[0], args: a.slice(1), lignes: [] }; doc.sections.push(cour); }
      else if (cour) cour.lignes.push(l);
      else if (l.startsWith("# ")) doc.titre = l.slice(2).trim();
      else { const m = l.match(/^([^:]{2,30}?) ?: ?(.*)$/); if (m) doc.meta[m[1].trim()] = m[2].trim(); }
    }
    doc.sections.forEach(s => s.corps = s.lignes.join("\n").trim());
    return doc;
  }
  const lParas = c => c.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean);
  const lPuces = c => c.split("\n").filter(l => /^- /.test(l)).map(l => l.slice(2).trim());
  const lPaires = c => lPuces(c).map(l => { const a = l.split(SEP); return [a[0].trim(), a.slice(1).join(SEP).trim()]; });

  /* lire : renvoie { erreurs:[…], neufs:[…] } et modifie D.
     image(fichier) → [id,w,h] si le fichier est connu, sinon null (image nouvelle : une entrée {neuf:fichier, leg} est posée, à traiter par l'appelant). */
  function lire(D, id, texte, image) {
    const p = pages(D).find(x => x.id === id); if (!p) throw new Error("Page inconnue : " + id);
    const doc = decoupe(texte), err = [], neufs = [];
    const lImgs = (c, sansLegende) => lPuces(c.split("\n").filter(l => !/^Légende ?:/.test(l)).join("\n")).map(l => {
      const a = l.split(SEP), f = a[0].trim(), leg = a.slice(1).join(SEP).trim(), k = image(f);
      if (!k) { const e = { neuf: f, leg: sansLegende ? "" : leg }; neufs.push(e); return e; }
      return leg && !sansLegende ? [k[0], k[1], k[2], leg] : [k[0], k[1], k[2]];
    });
    const S = n => doc.sections.filter(s => s.nom === n), un = n => { const a = S(n); if (!a.length) err.push("Section « " + n + " » absente : contenu conservé tel qu'il est sur le site."); return a[0]; };
    const si = (n, f) => { const s = un(n); if (s) f(s.corps, s); };
    if (p.type === "accueil") {
      const A = D.accueil;
      si("Métiers", c => A.metiers = lPuces(c)); si("Phrase d'introduction", c => A.phrase = c.split("\n").map(x => x.trim()).filter(Boolean).join("\n")); si("Trois colonnes", c => A.trois = lPaires(c));
      const h = S("Images d'ouverture"); if (h.length) D.heroSets = h.map(s => lImgs(s.corps, true)); else err.push("Aucun jeu d'images d'ouverture : conservés.");
    } else if (p.type === "apropos") {
      const A = D.apropos, bl = n => S(n).map(s => {
        const L = s.corps.split("\n"), note = L.filter(l => /^Note ?:/.test(l)).map(l => l.replace(/^Note ?: ?/, "")).join(" ");
        const e = { d: s.args[0] || "", t: s.args[1] || "", p: L.filter(l => !/^- /.test(l) && !/^Note ?:/.test(l)).join("\n").trim().replace(/\s*\n\s*/g, " ") };
        const li = lPuces(s.corps); e.li = li; e.note = note; return e;
      });
      si("Chapô", c => A.chapo = c.replace(/\s*\n\s*/g, " "));
      if (S("Expérience").length) A.exp = bl("Expérience"); if (S("Formation").length) A.formation = bl("Formation");
      si("Compétences", c => A.competences = lPuces(c)); si("Et aussi", c => A.aussi = lPuces(c));
    } else if (p.type === "mur") {
      si("Images", c => poseMur(D, id, lImgs(c)));
    } else if (p.type === "fiche" || p.type === "ia") {
      const o = objet(D, id); if (doc.titre) o.t = doc.titre;
      const M = (k, c) => { if (k in doc.meta) o[c] = doc.meta[k]; };
      if (p.type === "fiche") { M("Date", "d"); M("Personnalités", "w"); } else { M("Catégorie", "k"); M("Année", "d"); si("Liens", c => o.liens = lPaires(c)); si("Films", c => o.films = lPaires(c)); }
      si("Texte", c => o.x = lParas(c)); si("Images", c => o.p = lImgs(c));
    } else {
      const f = objet(D, id); if (doc.titre) f.t = doc.titre;
      if ("Bandeau" in doc.meta) f.k = doc.meta.Bandeau;
      si("Chapô", c => f.c = c.replace(/\s*\n\s*/g, " ")); si("Chiffres clés", c => f.chiffres = lPaires(c));
      si("Image d'ouverture", c => { const a = lImgs(c, true); if (a.length) f.hero = a[a.length - 1]; });
      if (p.type === "recit") {
        const R = []; let av = false;
        doc.sections.forEach(s => {
          if (s.nom === "Chapô" || s.nom === "Chiffres clés" || s.nom === "Image d'ouverture") { if (R.length) av = true; return; }
          if (s.nom === "Images") {
            const b = { img: lImgs(s.corps), leg: (s.corps.split("\n").find(l => /^Légende ?:/.test(l)) || "").replace(/^Légende ?: ?/, "") };
            if (/page/i.test(s.args[0] || "")) b.pg = 1; else if (/mosa/i.test(s.args[0] || "")) b.mur = 1; R.push(b);
          } else if (s.nom === "Films") R.push({ films: lPaires(s.corps) });
          else if (s.nom === "Liens") R.push({ liens_seuls: lPaires(s.corps) });
          else if (s.nom === "Liens du texte") { const d = R[R.length - 1]; if (d && "h" in d) d.liens = lPaires(s.corps); else err.push("« Liens du texte » sans texte juste avant : ignoré."); }
          else if (s.nom === "Texte" || s.nom === "Puces") {
            const b = { n: s.args[0] || "", k: s.args[1] || "" }; if (s.args[2]) b.d = s.args[2]; b.h = s.args.slice(3).join(SEP);
            if (s.nom === "Puces") b.liste = lPuces(s.corps); else b.x = lParas(s.corps); R.push(b);
          } else err.push("Section « " + s.nom + " » non reconnue : ignorée.");
        });
        if (av) err.push("Chapô, chiffres clés et image d'ouverture doivent rester avant le récit.");
        if (R.length) f.recit = R; else err.push("Récit vide : conservé tel qu'il est sur le site.");
      } else {
        if (f.poeme && S("Poème").length) f.poeme = S("Poème")[0].corps.split("\n").map(x => x.trim()).filter(Boolean);
        const ss = S("Section"); if (ss.length) f.sections = ss.map(s => [s.args.join(SEP), lParas(s.corps)]);
        if (f.bandeau) si("Images : bandeau", c => f.bandeau = lImgs(c, true));
        if (f.diplomes) si("Images : diplômes", c => f.diplomes = lImgs(c, true));
        si("Images : galerie", c => f.galerie = lImgs(c, true));
      }
    }
    return { erreurs: err, neufs };
  }

  // identifiants des images d'une page, dans l'ordre du fichier (doublons retirés)
  function images(D, id) { const L = []; ecrire(D, id, i => { if (!L.includes(i)) L.push(i); return ""; }); return L; }
  // listes d'images d'une page (pour y ranger une image déposée dans le dossier sans être citée dans page.md)
  function derniereListe(D, id) {
    const p = pages(D).find(x => x.id === id), o = objet(D, id);
    if (p.type === "accueil") return D.heroSets[D.heroSets.length - 1];
    if (p.type === "mur") return mur(D, id);
    if (p.type === "fiche" || p.type === "ia") return o.p;
    if (p.type === "recit") { const b = o.recit.filter(x => x.img); return b.length ? b[b.length - 1].img : null; }
    if (p.type === "focus") return o.galerie;
    return null;
  }
  // texte canonique d'une valeur (clés triées) : pour comparer deux versions sans tenir compte de l'ordre des clés
  const canon = o => JSON.stringify(o, (k, v) => v && typeof v === "object" && !Array.isArray(v) ? Object.keys(v).sort().reduce((r, x) => (r[x] = v[x], r), {}) : v);
  const api = { pages, objet, ecrire, lire, images, derniereListe, decoupe, canon };
  if (typeof module !== "undefined" && module.exports) module.exports = api; else racine.FABLE = api;
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>
"use strict";
const DEPOT="queauem-eqeq/work", API="https://api.github.com/repos/"+DEPOT;
const BRANCHE=new URLSearchParams(location.search).get("branche")||"main";
const RAW=`https://raw.githubusercontent.com/${DEPOT}/${BRANCHE}/`;
const $=s=>document.querySelector(s), el=(t,a={},...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a)){if(n==="on")for(const[ev,f]of Object.entries(v))e.addEventListener(ev,f);else if(n==="html")e.innerHTML=v;else if(v!==false&&v!=null)e.setAttribute(n,v===true?"":v)}k.flat().forEach(c=>e.append(c));return e};
let D=null,JETON="",DOSSIER=null,shaTete="",ETAT={v:1,pages:{}},REFS0=new Set();
const MOD=new Set(),NEUF=new Map(),JOURNAL=[];   // pages modifiées · images ajoutées (id → {i,s,orig}) · opérations
const etat=t=>$("#etat").textContent=t;

/* ---------- accès : la clé GitHub est chiffrée par un mot de passe, dans ce navigateur ---------- */
const enc=new TextEncoder(),dec=new TextDecoder(),b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function cleDe(mdp,sel){const k=await crypto.subtle.importKey("raw",enc.encode(mdp),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:sel,iterations:250000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function chiffrer(mdp,txt){const sel=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},await cleDe(mdp,sel),enc.encode(txt));return JSON.stringify({s:b64(sel),i:b64(iv),c:b64(c)})}
async function dechiffrer(mdp,j){const o=JSON.parse(j);return dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(o.i)},await cleDe(mdp,ub64(o.s)),ub64(o.c)))}
function ecranAcces(msg){
  const a=$("#acces"),coffre=localStorage.getItem("bo_coffre");a.innerHTML="";
  const mdp=el("input",{type:"password",placeholder:"Mot de passe",autocomplete:"current-password"});
  if(coffre){
    a.append(el("h1",{},"Déverrouiller"),el("p",{},"Votre clé GitHub est enregistrée, chiffrée, dans ce navigateur."),mdp,
      el("p",{class:"err"},msg||""),el("div",{class:"ligne"},
        el("button",{class:"go",on:{click:async()=>{try{JETON=await dechiffrer(mdp.value,coffre);demarrer()}catch(e){ecranAcces("Mot de passe incorrect.")}}}},"Ouvrir"),
        el("button",{on:{click:()=>{if(confirm("Oublier la clé enregistrée dans ce navigateur ?")){localStorage.removeItem("bo_coffre");ecranAcces()}}}},"Oublier la clé")));
    mdp.addEventListener("keydown",e=>{if(e.key==="Enter")a.querySelector(".go").click()});
  }else{
    const cle=el("input",{type:"password",placeholder:"github_pat_…",autocomplete:"off"}),m2=el("input",{type:"password",placeholder:"Confirmer le mot de passe"});
    a.append(el("h1",{},"Première ouverture"),el("p",{},"Collez votre clé GitHub (accès au seul dépôt « work », contenu en lecture et écriture), puis choisissez un mot de passe. La clé est chiffrée et ne quitte pas ce navigateur."),

    const r=FABLE.lire(Dn,p.id,await pres["page.md"].f.text(),n=>{cites.add(n);return connu(n)});
    r.erreurs.forEach(e=>ch2.push("⚠ "+e));
    const ajoute=async(n,leg)=>{try{const k=await preparer(pres[n].f,Dn,p.id);NEUF.get(k[0]).fichier=n;prov.set(k[0],1);return leg?[...k,leg]:k}catch(e){ch2.push("⚠ image illisible, ignorée : "+n);return null}};
    const racine=p.id==="accueil"?Dn.heroSets:p.type==="mur"?{affiches:Dn.affiches,voeux:Dn.edition.voeux,infotravaux:Dn.edition.infotravaux}[p.id]:FABLE.objet(Dn,p.id);
    await remplaceNeufs(racine,async e=>{if(!pres[e.neuf]){ch2.push("image retirée (fichier absent du dossier) : "+e.neuf);return null}ch2.push((F[e.neuf]?"image remplacée : ":"image ajoutée : ")+e.neuf);return ajoute(e.neuf,e.leg)});
    for(const n of Object.keys(pres))if(EXT.test(n)&&!cites.has(n)&&!F[n]&&idDuNom(n)==null){const L=FABLE.derniereListe(Dn,p.id);if(!L)continue;const k=await ajoute(n);if(k){L.push(k);ch2.push("image ajoutée en fin de page (non citée dans page.md) : "+n)}}
    if(contenu(Dn,p.id)!==contenu(D,p.id)){if(!ch2.some(x=>x[0]!=="⚠"))ch2.push("texte, légendes ou ordre modifiés");rapport.push([p,ch2,true])}else if(ch2.length)rapport.push([p,ch2,false]);
  }
  const mod=rapport.filter(r=>r[2]);P.innerHTML="";P.append(el("h1",{},"Publier depuis FABLE_SITE"));
  if(!rapport.length)return P.append(el("p",{},"Aucun écart : les dossiers et le site disent la même chose."));
  rapport.forEach(([p,L,m])=>P.append(el("div",{class:"bloc"},el("div",{class:"tt"},el("span",{},p.g+" · "+p.t),m?"sera mis à jour":"inchangé"),el("ul",{},L.map(x=>el("li",{},x))))));
  const annule=()=>{for(const id of prov.keys())NEUF.delete(id);P.innerHTML="";P.append(el("p",{class:"depot"},"Annulé : rien n'a été modifié."))};
  if(!mod.length)return P.append(el("button",{on:{click:annule}},"Fermer"));
  P.append(el("div",{class:"ligne"},el("button",{class:"go",on:{click:()=>{D=Dn;mod.forEach(r=>MOD.add(r[0].id));JOURNAL.push(...mod.flatMap(r=>r[1].map(x=>r[0].id+" : "+x)));menu();enregistrer()}}},`Publier ${mod.length} page(s) sur le site`),el("button",{on:{click:annule}},"Annuler")));
}

/* ---------- dossier FABLE_SITE : choisi une fois, retrouvé aux ouvertures suivantes ---------- */
const bd=()=>new Promise((ok,ko)=>{const r=indexedDB.open("backoffice",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const bdGet=async k=>{try{const b=await bd();return await new Promise(ok=>{const r=b.transaction("k").objectStore("k").get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}catch(e){return null}};
const bdSet=async(k,v)=>{try{const b=await bd();b.transaction("k","readwrite").objectStore("k").put(v,k)}catch(e){}};
async function poseDossier(d){DOSSIER=d;try{ETAT=JSON.parse(await lire(d,"_backoffice/etat.json")||"0")||{v:1,pages:{}}}catch(e){ETAT={v:1,pages:{}}}
  $("#bDossier").textContent="Dossier : "+d.name;$("#bRelire").disabled=false;etat(`Branche « ${BRANCHE} » · dossier « ${d.name} » prêt`)}
$("#bDossier").onclick=async()=>{if(!window.showDirectoryPicker)return alert("Ce navigateur ne permet pas d'écrire dans un dossier : utilisez Edge ou Chrome.");
  try{const mem=await bdGet("dossier");if(mem&&!DOSSIER&&await mem.requestPermission({mode:"readwrite"})==="granted")return poseDossier(mem);
    const d=await showDirectoryPicker({mode:"readwrite"});if(d.name!=="FABLE_SITE"&&!confirm(`Le dossier choisi s'appelle « ${d.name} », pas « FABLE_SITE ». Continuer ?`))return;await bdSet("dossier",d);poseDossier(d)}catch(e){}};
bdGet("dossier").then(m=>{if(m&&!DOSSIER)$("#bDossier").textContent="Rouvrir le dossier "+m.name});
addEventListener("beforeunload",e=>{if(MOD.size){e.preventDefault();e.returnValue=""}});
if(!window.__test)ecranAcces();
