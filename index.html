<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emmanuel Quéau, portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Mise en page : l'image d'abord, pleine largeur ; le texte en colonne étroite ; un seul accent rouge. */
  --noir:#0b0b0c; --encre:#141416; --trait:#2a2a2e; --papier:#f3f0ea; --gris:#9a968f; --rouge:#ff2d3f;
  --titre:"Instrument Serif","Times New Roman",serif; --texte:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --g:clamp(16px,4vw,56px);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--noir);color:var(--papier);font-family:var(--texte);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%;height:auto}
img{opacity:1}.hero img{opacity:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--rouge);outline-offset:3px}
h1,h2,h3{font-family:var(--titre);font-weight:400;line-height:1.02;text-wrap:balance;letter-spacing:-.01em}
.cap{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gris)}
.cap b{color:var(--rouge);font-weight:600}
.wrap{padding-inline:var(--g)}
.col{max-width:68ch}

/* en-tête */
header{position:fixed;inset:0 0 auto 0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px var(--g);background:linear-gradient(#0b0b0cee,#0b0b0c00);transition:background .3s}
header.plein{background:#0b0b0cf2;border-bottom:1px solid var(--trait)}
.nom{font-family:var(--titre);font-size:24px;white-space:nowrap}
.nom i{color:var(--rouge);font-style:normal}
nav{display:flex;gap:clamp(10px,1.6vw,26px);flex-wrap:wrap;justify-content:flex-end}
nav a{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#d8d4cc;padding:6px 0;border-bottom:2px solid transparent}
nav a:hover,nav a.on{color:#fff;border-color:var(--rouge)}
#burger{display:none;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:8px 0}
@media(max-width:900px){
  #burger{display:block}
  nav{position:fixed;inset:0;background:#0b0b0cfa;flex-direction:column;justify-content:center;align-items:flex-start;padding:var(--g);gap:6px;display:none}
  nav.ouvert{display:flex}
  nav a{font-family:var(--titre);font-size:34px;letter-spacing:0;text-transform:none;font-weight:400}
  #burger{position:relative;z-index:2}
}

/* accueil */
.hero{position:relative;height:min(92vh,900px);min-height:520px;overflow:hidden;background:#000}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease}
.hero img.ok{opacity:0}.hero img.on.ok{opacity:1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0b0b0c55 0%,#0b0b0c00 30%,#0b0b0c00 45%,#0b0b0cf5 100%)}
.hero .txt{position:absolute;z-index:2;left:var(--g);right:var(--g);bottom:clamp(28px,6vh,70px)}
.hero h1{font-size:clamp(54px,11vw,170px);line-height:.9}
.hero h1 em{color:var(--rouge)}
.metiers{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:18px;font-size:clamp(13px,1.3vw,16px);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.metiers span+span::before{content:"";display:inline-block;width:22px;height:2px;background:var(--rouge);vertical-align:middle;margin-right:22px}
.intro{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,5vw,90px);padding-block:clamp(48px,8vw,120px);align-items:start}
.intro p.g{font-family:var(--titre);font-size:clamp(28px,3.6vw,54px);line-height:1.08}
.intro p.g em{color:var(--rouge)}
.trois{display:grid;gap:26px}
.trois h3{font-size:30px;margin-bottom:4px}
.trois p{color:#cfcbc3;font-size:16px}
@media(max-width:800px){.intro{grid-template-columns:1fr}}

section.bloc{padding-block:clamp(36px,6vw,90px)}
.tete{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:clamp(18px,3vw,36px);flex-wrap:wrap}
.tete h2{font-size:clamp(40px,6.5vw,96px)}
.lien{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;border-bottom:2px solid var(--rouge);padding-bottom:4px;white-space:nowrap}
.lien:hover{color:var(--rouge)}

/* cartes projets */
.projets{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.pj{position:relative;overflow:hidden;background:var(--encre);grid-column:span 3;aspect-ratio:4/5}
.pj:nth-child(1),.pj:nth-child(2){grid-column:span 6;aspect-ratio:3/2}
.pj img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.7,.2,1),filter .4s}
.pj::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 35%,#000d 100%)}
.pj:hover img{transform:scale(1.045)}
.pj .l{position:absolute;z-index:2;left:22px;right:22px;bottom:20px}
.pj h3{font-size:clamp(24px,2.5vw,40px);margin-top:6px}
.pj .cap{color:#e9e5dd}
@media(max-width:900px){.projets{grid-template-columns:1fr 1fr}.pj,.pj:nth-child(1),.pj:nth-child(2){grid-column:span 1;aspect-ratio:4/5}}
@media(max-width:560px){.projets{grid-template-columns:1fr}.pj,.pj:nth-child(1),.pj:nth-child(2){aspect-ratio:4/3}}

/* rubans défilants */
.ruban{display:flex;gap:6px;overflow-x:auto;padding-inline:var(--g);scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--trait) transparent}
.ruban>*{flex:0 0 auto;scroll-snap-align:start}
.ruban img{height:clamp(240px,34vw,460px);width:auto;background:var(--encre)}
.ruban.bas img{height:clamp(200px,26vw,360px)}

/* tuiles photo */
.tuiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tu{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--encre)}
.tu img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.tu:hover img{transform:scale(1.045)}
.tu::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 45%,#000c)}
.tu .l{position:absolute;z-index:2;left:20px;right:20px;bottom:18px}
.tu h3{font-size:clamp(26px,3vw,44px)}
@media(max-width:700px){.tuiles{grid-template-columns:1fr}.tu{aspect-ratio:4/3}}

/* pages */
main{min-height:80vh}
.page-tete{padding:clamp(110px,16vw,200px) var(--g) clamp(24px,4vw,48px)}
.page-tete h1{font-size:clamp(52px,10vw,150px);margin-top:10px}
.page-tete p.c{font-size:clamp(18px,2vw,24px);color:#d8d4cc;max-width:60ch;margin-top:20px}
.retour{display:inline-block;margin-bottom:22px}
.plein-img{width:100%;height:auto;max-height:92vh;object-fit:cover;background:var(--encre);cursor:zoom-in}
.chiffres{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--trait);margin-block:clamp(28px,5vw,60px)}
.chiffres div{padding:26px 22px 26px 0;border-right:1px solid var(--trait);margin-right:22px}
.chiffres div:last-child{border:0;margin:0}
.chiffres b{display:block;font-family:var(--titre);font-weight:400;font-size:clamp(34px,4.4vw,64px);line-height:1;color:var(--papier);font-variant-numeric:tabular-nums}
.chiffres span{display:block;margin-top:8px;font-size:14px;color:var(--gris);max-width:24ch}
@media(max-width:800px){.chiffres{grid-template-columns:1fr 1fr}.chiffres div{border-right:0;margin:0;border-bottom:1px solid var(--trait)}}
.sections{display:grid;gap:clamp(30px,5vw,60px)}
.sec{display:grid;grid-template-columns:minmax(180px,1fr) 3fr;gap:clamp(16px,4vw,60px)}
.sec h2{font-size:clamp(28px,3vw,42px)}
.sec p,.sec li{max-width:68ch;color:#e4e0d8}
.sec p+p{margin-top:14px}
.sec ul{list-style:none;display:grid;gap:12px}
.sec li{padding-left:26px;position:relative}
.sec li::before{content:"";position:absolute;left:0;top:.72em;width:14px;height:2px;background:var(--rouge)}
@media(max-width:800px){.sec{grid-template-columns:1fr}}

/* grilles d'images justifiées */
.rangs{display:flex;flex-direction:column;gap:6px;margin-top:clamp(28px,5vw,60px)}
.rang{display:flex;gap:6px}
.rang a{display:block;min-width:0;background:var(--encre);overflow:hidden;cursor:zoom-in}
.rang img{width:100%;height:100%;object-fit:cover;transition:opacity .3s}
.rang a:hover img{opacity:.86}
.mur{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(150px,17vw,250px),1fr));gap:6px}
.mur a{display:block;background:var(--encre);cursor:zoom-in;position:relative;overflow:hidden}
.mur img{width:100%;height:auto;transition:transform .5s}
.mur a:hover img{transform:scale(1.03)}
.mur .leg{padding:10px 2px 16px}
.mur .leg b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.mur .leg span{font-size:13px;color:var(--gris)}

/* index de fiches */
.fiches{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(240px,24vw,380px),1fr));gap:6px 6px}
.fi{display:block;background:var(--encre)}
.fi .im{aspect-ratio:3/2;overflow:hidden}
.fi img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.fi:hover img{transform:scale(1.05)}
.fi .l{padding:12px 14px 20px}
.fi h3{font-size:26px;line-height:1.05}
.fi .cap{display:block;margin-top:6px;font-size:11px}
.onglets{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:26px}
.onglets a{font-family:var(--titre);font-size:clamp(26px,3.4vw,44px);color:var(--gris);border-bottom:2px solid transparent}
.onglets a.on{color:var(--papier);border-color:var(--rouge)}

/* vidéos */
.films{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(240px,24vw,360px),1fr));gap:22px 6px}
.film .v{aspect-ratio:16/9;background:var(--encre) center/cover;position:relative;overflow:hidden;display:block}
.film .v::after{content:"";position:absolute;left:14px;bottom:14px;width:0;height:0;border-left:16px solid #fff;border-block:10px solid transparent;filter:drop-shadow(0 1px 6px #000)}
.film .v:hover{filter:brightness(1.12)}
.film .v .n{position:absolute;right:12px;top:6px;font-family:var(--titre);font-size:54px;color:#ffffff22}
.film h3{font-size:24px;margin-top:10px;line-height:1.08}
.film p{font-size:14px;color:#bdb9b1;margin-top:6px;max-width:44ch}
.note{font-size:14px;color:var(--gris);margin-top:14px}

/* à propos */
.apropos{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(24px,6vw,100px)}
.apropos h2{font-size:34px;margin:34px 0 14px}
.exp{border-top:1px solid var(--trait);padding:18px 0}
.exp b{display:block;font-size:18px}
.exp .cap{display:block;margin-bottom:6px}
.exp p,.exp li{color:#d8d4cc;font-size:16px}
.exp ul{list-style:none;margin-top:8px;display:grid;gap:6px}
.puces{display:flex;flex-wrap:wrap;gap:8px}
.puces span{border:1px solid var(--trait);padding:7px 12px;font-size:14px}
.contact a{display:block;font-family:var(--titre);font-size:clamp(26px,3vw,40px);border-bottom:1px solid var(--trait);padding:12px 0}
.contact a:hover{color:var(--rouge)}
@media(max-width:800px){.apropos{grid-template-columns:1fr}}

footer{border-top:1px solid var(--trait);margin-top:clamp(50px,8vw,120px);padding:28px var(--g) 40px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--gris);font-size:14px}

/* visionneuse */
#lb{position:fixed;inset:0;z-index:100;background:#000000f2;display:none;align-items:center;justify-content:center;padding:56px 76px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb button{position:absolute;color:#fff;font-size:34px;width:60px;height:60px;display:grid;place-items:center}
#lb .x{top:6px;right:8px}#lb .p{left:8px;top:50%;transform:translateY(-50%)}#lb .s{right:8px;top:50%;transform:translateY(-50%)}
#lb .c{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:13px;color:var(--gris);letter-spacing:.1em}
@media(max-width:700px){#lb{padding:56px 10px 60px}#lb .p,#lb .s{top:auto;bottom:2px;transform:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ajouts */
.h2b{font-size:clamp(30px,4vw,56px)}
.sst{font-family:var(--titre);font-size:clamp(22px,2.2vw,30px);margin:26px 0 8px;color:var(--papier)}
.sec p b,.col p b{color:#fff;font-weight:600}
.poeme{font-family:var(--titre);font-size:min(5.1vw,46px);line-height:1.22;margin:clamp(34px,6vw,70px) 0 clamp(10px,2vw,20px);padding-left:clamp(10px,2vw,28px);border-left:3px solid var(--rouge);display:grid;gap:0}
.poeme span{display:block;white-space:nowrap}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(150px,19vw,280px),1fr));gap:8px;align-items:start;margin-top:10px}
.pages a{display:block;background:var(--encre);cursor:zoom-in;box-shadow:0 1px 0 #ffffff14}
.pages img{width:100%;height:auto;transition:opacity .3s}
.pages a:hover img{opacity:.85}
.fi .im.vide{background:linear-gradient(135deg,#17171b,#0f0f12);position:relative}
.fi .im.vide::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%) rotate(45deg);border:2px solid var(--rouge);opacity:.5}
.note a.lien{margin-right:10px}

/* lecteur video en superposition */
#vb{position:fixed;inset:0;z-index:110;background:#000000f5;display:none;align-items:center;justify-content:center;padding:clamp(8px,3vw,48px)}
#vb.on{display:flex}
#vb .cadre{width:min(100%,177.7778vh);width:min(100%,177.7778dvh);aspect-ratio:16/9;max-height:100%;background:#000;box-shadow:0 20px 60px #000}
#vb iframe{width:100%;height:100%;border:0;display:block}
#vb .x{position:absolute;top:4px;right:8px;color:#fff;font-size:34px;width:56px;height:56px;display:grid;place-items:center}
#vb .t{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:13px;color:var(--gris);letter-spacing:.08em;padding-inline:60px}

/* telephone bascule en paysage : l'image et le film prennent toute la hauteur */
@media (orientation:landscape) and (max-height:560px){
  #lb{padding:4px 52px}
  #lb button{width:46px;height:46px;font-size:28px}
  #lb .x{top:0;right:0}
  #lb .p{left:0;top:50%;bottom:auto;transform:translateY(-50%)}
  #lb .s{right:0;top:50%;bottom:auto;transform:translateY(-50%)}
  #lb .c{bottom:2px;font-size:11px}
  #vb{padding:2px}
  #vb .x{top:0;right:0;width:46px;height:46px;font-size:28px}
  #vb .t{display:none}
}

/* largeur maximale : le site reste centre sur les grands ecrans */
:root{--max:1500px}
main{max-width:var(--max);margin-inline:auto}
header,footer{padding-inline:max(var(--g),calc((100vw - var(--max))/2 + var(--g)))}

/* au plus trois elements de front, quatre pour les dossiers Focus */
.projets{grid-template-columns:repeat(3,1fr)}
.pj,.pj:nth-child(1),.pj:nth-child(2){grid-column:span 1;aspect-ratio:3/4}
.fiches,.films{grid-template-columns:repeat(3,1fr)}
@media(max-width:1200px){.projets{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1000px){
  .fiches,.films{grid-template-columns:repeat(2,1fr)}
  .projets{grid-template-columns:repeat(2,1fr)}
  .pj,.pj:nth-child(1),.pj:nth-child(2){grid-column:span 1;aspect-ratio:4/5}
}
@media(max-width:620px){
  .fiches,.films{grid-template-columns:1fr}
  .projets{grid-template-columns:1fr}
  .pj,.pj:nth-child(1),.pj:nth-child(2){aspect-ratio:4/3}
}

/* bandeau d'affiches, a la place des chiffres cles */
.bandeau{display:flex;gap:10px;flex-wrap:nowrap;overflow-x:auto;border-block:1px solid var(--trait);padding-block:22px;margin-block:clamp(24px,4vw,46px)}
.bandeau a{flex:0 0 auto;display:block;background:var(--encre)}
.bandeau img{height:clamp(190px,24vw,320px);width:auto}
.bandeau.dip{border-top:0;padding-top:0;margin-top:calc(-1 * clamp(24px,4vw,46px) + 10px)}
.bandeau.dip img{height:clamp(150px,19vw,250px)}
/* galerie en grille reguliere */
.grille{display:grid;gap:8px;margin-top:clamp(28px,5vw,60px);align-items:start}
.grille a{display:block;background:var(--encre);cursor:zoom-in;overflow:hidden}
.grille div{background:var(--encre);overflow:hidden}
.grille img{width:100%;height:auto;transition:opacity .3s}
.grille a:hover img{opacity:.85}
@media(max-width:900px){.grille{grid-template-columns:repeat(3,1fr)!important}}
@media(max-width:560px){.grille{grid-template-columns:repeat(2,1fr)!important}}

/* dossier en recit : chapitres de texte et temps d'images alternes */
.somm{display:flex;flex-wrap:wrap;gap:8px 10px;margin-bottom:clamp(40px,7vw,90px)}
.somm button{border:1px solid var(--trait);padding:8px 14px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#d8d4cc;transition:border-color .2s,color .2s}
.somm button b{color:var(--rouge);font-weight:600;margin-right:4px}
.somm button:hover{border-color:var(--rouge);color:#fff}
.recit{display:grid;gap:clamp(26px,4vw,52px)}
.chap{scroll-margin-top:90px;padding-top:clamp(34px,6vw,84px);border-top:1px solid var(--trait)}
.chap:first-child{padding-top:0;border-top:0}
.chap .num>b{display:block;font-family:var(--titre);font-weight:400;font-size:clamp(64px,9vw,140px);line-height:.82;color:var(--papier);margin-bottom:14px;font-variant-numeric:tabular-nums}
.chap h2{font-size:clamp(32px,4.4vw,62px);margin-bottom:clamp(14px,2vw,24px);max-width:20ch}
.chap p{font-size:clamp(17px,1.35vw,19px)}
.chap .liens{display:flex;gap:14px 28px;flex-wrap:wrap;margin-top:26px}
.phase .rangs{margin-top:0}
.liens.phase{display:flex;gap:14px 28px;flex-wrap:wrap;margin-top:-6px}
.reperes{border-block:1px solid var(--trait);padding-block:16px;margin-bottom:clamp(24px,4vw,44px);display:grid;gap:6px}
.reperes span{font-size:15px;color:#d8d4cc}
.visite{display:grid;gap:clamp(22px,3.4vw,44px)}
.visite .col p{font-size:clamp(17px,1.35vw,19px)}
.phase figcaption{margin-top:12px;line-height:1.5;max-width:90ch}
.phase.pg .rang a{box-shadow:0 0 0 1px var(--trait)}
.films.phase{margin-top:6px}
@media(max-width:800px){.chap .num{display:flex;align-items:baseline;gap:14px}.chap .num>b{font-size:64px;margin:0}}
</style>
</head>
<body>
<header id="hd">
  <a class="nom" href="#accueil">Emmanuel Quéau<i>.</i></a>
  <button id="burger" aria-expanded="false" aria-controls="menu">Menu</button>
  <nav id="menu"></nav>
</header>
<main id="app"></main>
<footer><span>Emmanuel Quéau · Communication, graphisme, photographie, vidéo</span><span>queau.emm@gmail.com · 06 25 75 70 22</span></footer>

le bailleur CDC Habitat."],"p":[[391,1400,933],[392,1400,933],[393,1400,933]]},{"id":"v-fabienne-balussou","t":"Fabienne Balussou","d":"Mardi 30 juin 2026","w":"Fabienne Balussou, préfète de l'Essonne ; Damien Allouch, maire ; association Abri Handicap","x":["Mardi 30 juin 2026, la Ville a eu l'honneur de recevoir Fabienne Balussou, préfète de l'Essonne, pour des échanges autour des grands enjeux d'Épinay-sous-Sénart. Après un accueil républicain à l'Hôtel de Ville, puis une visite de la centrale de géothermie, la préfète s'est rendue, aux côtés de M. le Maire Damien Allouch, au centre socioculturel Joséphine-Baker pour rencontrer l'association Abri Handicap, représentée par sa présidente Mireille Tidji, son équipe, des aidants et des familles accompagnées.","Les échanges ont mis en lumière les actions conduites en faveur de l'inclusion : accès aux droits, accompagnement personnalisé, soutien et répit des aidants, sensibilisation au handicap, autonomisation des jeunes et accompagnement vers l'emploi. La Ville poursuit son action aux côtés de l'association, notamment à travers le projet de Cité du handicap. Cette visite a également permis de faire le point sur les grands projets de la commune : le renouvellement urbain du quartier de La Plaine, le futur pôle de services publics et l'installation de nouveaux commerces au cœur de ville."],"p":[[394,1400,933],[395,1400,933],[396,1400,933],[397,1400,933]]},{"id":"v-anru","t":"ANRU","d":"Vendredi 16 janvier 2026","w":"","x":["Vendredi 16 janvier 2026, Épinay-sous-Sénart a accueilli  dans le cadre du renouvellement urbain du quartier de La Plaine."],"p":[[398,1400,933],[399,1400,933],[400,1400,933]]},{"id":"v-julie-bouaziz","t":"Julie Bouaziz","d":"Mercredi 12 novembre 2025","w":"Julie Bouaziz, préfète déléguée pour l'égalité des chances ; Damien Allouch, maire ; APA de Géant","x":["Mercredi 12 novembre 2025, Julie Bouaziz, préfète déléguée pour l'égalité des chances, s'est rendue à Épinay-sous-Sénart, aux côtés de M. le Maire Damien Allouch, pour rencontrer les acteurs de l'inclusion par l'activité physique adaptée et la culture. À la Maison de santé pluridisciplinaire, elle a découvert les actions d'APA de Géant, structure spinolienne de l'économie sociale et solidaire qui propose depuis dix ans des activités physiques adaptées aux personnes en situation de handicap, isolées, prises en charge pour une affection de longue durée et aux seniors.","À la MAC, la préfète a échangé avec les équipes sur l'accès des publics fragilisés aux activités culturelles, notamment grâce à la Micro-Folie, le musée numérique de la Ville. Cette visite s'inscrit dans la construction d'une « Cité du handicap » à Épinay-sous-Sénart."],"p":[[401,1400,933],[402,1400,933],[403,1400,933],[404,1400,933]]},{"id":"v-terre-davenir","t":"Terre d'avenir","d":"Octobre 2025","w":"Damien Allouch, maire ; Michel Bournat, vice-président du Département de l'Essonne","x":["En octobre 2025, M. le Maire Damien Allouch et Michel Bournat, vice-président du Département de l'Essonne, ont signé le contrat « Terre d'Avenir » 2025-2028. D'un montant global de 1,8 M€, financé conjointement par le Département et la Ville, ce contrat soutient quatre projets : le terrain synthétique du stade Alain-Mimoun, la rénovation des rues Charles-Gounod et Pasteur et du parking Beethoven, un court de tennis extérieur et l'aménagement des abords de l'Yerres."],"p":[[405,1400,933],[406,1400,933],[407,1400,933]]},{"id":"v-stephane-viry","t":"Stéphane Viry","d":"Mercredi 14 mai 2025","w":"Stéphane Viry, député","x":["Mercredi 14 mai 2025, Stéphane Viry, porteur de la proposition de loi visant à pérenniser l'expérimentation Territoire zéro chômeur de longue durée, est venu à la rencontre des acteurs et des volontaires du projet spinolien, lors d'une table ronde à la MAC. Cette visite s'est déroulée pendant le « Laboratoire des travaux utiles », semaine consacrée au projet, au lendemain de l'inauguration de Nouvel'R, première entreprise à but d'emploi du territoire. Le député a écouté les difficultés rencontrées et pris note des améliorations possibles, afin de nourrir les débats à l'Assemblée nationale.","Une visite qui témoigne de la portée nationale de cette réussite locale."],"p":[[408,1400,933],[409,1400,933],[410,1400,933],[411,1400,1050]]},{"id":"v-territoire-zero-chomeur","t":"Territoire zéro chômeur","d":"Vendredi 14 mars 2025","w":"Damien Allouch, maire ; Julie Bouaziz, préfète déléguée ; François Durovray, président du Conseil départemental","x":["Vendredi 14 mars 2025, la salle des mariages de l'Hôtel de Ville a accueilli la signature des conventions de partenariat du projet Territoire zéro chômeur de longue durée et la remise des contrats de travail aux premiers salariés de Nouvel'R, première entreprise à but d'emploi spinolienne. Autour de M. le Maire Damien Allouch, de nombreuses personnalités étaient présentes, dont Julie Bouaziz, préfète déléguée pour l'égalité des chances, et François Durovray, président du Conseil départemental de l'Essonne, ainsi que les représentants de l'agglomération, de France Travail et du Fonds d'expérimentation territoriale contre le chômage de longue durée.","Cette cérémonie a conclu quatre années d'efforts conjoints de la municipalité, des institutions, des associations et des volontaires pour obtenir l'habilitation, la première en Essonne."],"p":[[412,1400,933],[413,1400,933],[414,1400,933],[415,1400,933]]},{"id":"v-juliette-meadel","t":"Juliette Méadel","d":"Jeudi 30 janvier 2025","w":"Juliette Méadel, ministre déléguée chargée de la Ville ; Frédérique Camilleri, préfète de l'Essonne ; Damien Allouch, maire","x":["Jeudi 30 janvier 2025, M. le Maire Damien Allouch, Frédérique Camilleri, préfète de l'Essonne, et les élus de l'agglomération ont accueilli Juliette Méadel, ministre déléguée chargée de la Ville, à l'Hôtel de Ville. Réhabilitation et entretien des copropriétés, relogement pendant la rénovation urbaine, ascenseurs ou éclairages en panne, impact des trafics sur le quotidien, vidéosurveillance, rôle des bailleurs sociaux : la ministre a affirmé sa volonté de mobiliser les moyens de l'État pour répondre aux préoccupations des habitants.","La visite s'est poursuivie dans le quartier de La Plaine avec les bailleurs sociaux, puis au centre socioculturel Joséphine-Baker, pour un échange avec les acteurs locaux de l'économie sociale et solidaire. Juliette Méadel a salué le dynamisme du tissu associatif spinolien."],"p":[[416,1400,933],[417,1400,933],[418,933,1400],[419,1400,933]]},{"id":"v-francois-hollande","t":"François Hollande","d":"Mardi 28 mai 2024","w":"François Hollande, ancien président de la République ; Damien Allouch, maire","x":["Mardi 28 mai 2024, l'ancien président de la République François Hollande a participé à l'inauguration de l'exposition « L'Union européenne », au parc de l'Europe, aux côtés de M. le Maire Damien Allouch. Il a ensuite répondu pendant une heure aux questions des collégiens et des lycéens, au lycée Maurice-Eliot.","Citoyenneté, débat d'idées, volonté de rassembler les bonnes volontés autour de projets communs pour servir l'intérêt général : ces valeurs, partagées par l'équipe municipale, l'Éducation nationale et l'Union européenne, ont donné tout son sens à cette visite. Devant les élèves spinoliens venus nombreux, François Hollande et M. le Maire ont pris la parole pour évoquer le projet européen. Ils ont insisté sur la nécessité de rester rassemblés pour défendre les grands dossiers qui touchent notre quotidien à l'échelle internationale. Tous deux ont rappelé l'importance de faire entendre sa voix lors des élections européennes du dimanche 9 juin 2024.","Après la visite de l'exposition, l'ancien président s'est rendu au lycée Maurice-Eliot, où il a reçu un accueil chaleureux. Les questions des élèves, nombreuses et exigeantes, ont permis d'aborder des sujets de fond : les élections européennes, le conflit au Moyen-Orient, la situation en Nouvelle-Calédonie, l'Éducation nationale, l'ONU et les Jeux olympiques. François Hollande a aussi insisté sur la responsabilité première de l'action politique : maintenir l'unité du pays autour d'un projet commun. La Ville remercie François Hollande pour cette visite, qui laissera un souvenir à toute une génération d'élèves spinoliens."],"p":[[420,1400,933],[421,1400,933],[422,1400,933],[423,1400,933]]},{"id":"v-yael-braun-pivet","t":"Yaël Braun-Pivet","d":"Vendredi 20 octobre 2023","w":"Yaël Braun-Pivet, présidente de l'Assemblée nationale ; Marie Guévenoux et Robin Reda, députés ; Pascale Coq, directrice académique ; Bertrand Gaume, préfet","x":["Yaël Braun-Pivet, présidente de l'Assemblée nationale, a rendu visite aux élèves spinoliens du programme « Les cordées de la réussite », aux côtés des députés de l'Essonne Marie Guévenoux et Robin Reda, de Pascale Coq, directrice académique, et de Bertrand Gaume, préfet de l'Essonne. Grâce à deux professeurs du collège La Vallée et un professeur du lycée Maurice-Eliot, dix élèves spinoliens travaillent avec les élèves et l'équipe éducative du lycée Stanislas, où ils découvrent des formations d'excellence et échangent avec des élèves de classes préparatoires.","Les élèves ont partagé leurs ambitions professionnelles et entendu des témoignages inspirants. M. le Maire Damien Allouch a rendu hommage aux enseignants pour cette opportunité offerte aux élèves spinoliens."],"p":[[424,1400,933],[425,1400,933],[426,1400,933],[427,1400,933]]},{"id":"v-bertrand-gaume","t":"Bertrand Gaume","d":"Mercredi 1er février 2023","w":"Bertrand Gaume, préfet de l'Essonne ; Damien Allouch, maire","x":["Mercredi 1er février 2023, Bertrand Gaume, préfet de l'Essonne depuis août 2022, a visité la Ville aux côtés de M. le Maire Damien Allouch. Au programme : la rencontre d'Anthony Seddiki autour de Visière solidaire et de Cosmyx3D, pour évoquer la formation et la réindustrialisation du territoire grâce à l'impression 3D ; l'équipe sport-santé de la Maison de santé pluridisciplinaire et l'association APA de Géant ; enfin la police intercommunale, pour parler de la lutte contre la délinquance et les rodéos urbains."],"p":[[428,1400,933],[429,1400,933],[430,1400,933],[431,1400,933]]},{"id":"v-egalite-des-chances","t":"Égalité des chances","d":"Lundi 14 février 2022","w":"","x":["Lundi 14 février 2022,  s'est rendue à Épinay-sous-Sénart."],"p":[[432,1400,933],[433,1400,933],[434,1400,933]]},{"id":"v-guillaume-nery","t":"Guillaume Néry","d":"Mercredi 8 décembre 2021","w":"Guillaume Néry, double champion du monde d'apnée","x":["Lors de deux rencontres, au lycée Maurice-Eliot puis au Pôle ressources jeunesse – HUB 322, Guillaume Néry a partagé sa passion des profondeurs avec les jeunes du territoire : plongées en Antarctique et aux Galápagos, rencontres avec requins-marteaux et cachalots, engagement pour la sauvegarde des fonds marins. La rencontre s'est poursuivie dans la fosse de la piscine des Sénarts, à Boussy-Saint-Antoine : exercices de respiration, puis plongée en apnée à 6 mètres pour tous."],"p":[[435,1400,933],[436,1400,933],[437,1400,933],[438,1400,933]]},{"id":"v-eric-jalon","t":"Éric Jalon","d":"Mercredi 20 octobre 2021","w":"Éric Jalon, préfet de l'Essonne ; Damien Allouch, maire","x":["Présent lors de la signature de la convention de renouvellement urbain de La Plaine, Éric Jalon, préfet de l'Essonne, est revenu à Épinay-sous-Sénart pour mieux connaître les projets de la municipalité. Après un entretien avec M. le Maire Damien Allouch sur les enjeux de la ville (finances, rénovation urbaine, sécurité, transition écologique, Cité éducative, géothermie), il a arpenté le quartier de La Plaine, puis rencontré la police municipale mutualisée avec Boussy-Saint-Antoine.","Il a ensuite découvert Visière solidaire, fleuron spinolien de l'impression 3D, avant un long échange avec les élus du Conseil municipal des jeunes sur le rôle de l'État et les valeurs de la République. Les enfants du Conseil municipal lui ont remis leur « Abécédaire de la laïcité »."],"p":[[439,1400,933],[440,1400,933],[441,1400,933],[442,1400,933]]},{"id":"v-elisabeth-moreno","t":"Élisabeth Moreno","d":"Vendredi 21 mai 2021","w":"Élisabeth Moreno, ministre déléguée chargée de l'Égalité des chances ; Damien Allouch, maire","x":["Vendredi 21 mai 2021, Élisabeth Moreno, ministre déléguée chargée de l'Égalité entre les femmes et les hommes, de la Diversité et de l'Égalité des chances, s'est rendue au collège La Vallée, où elle a été accueillie par M. le Maire Damien Allouch et l'équipe municipale. Après un échange avec les élèves dans la cour, elle a remis un diplôme de parrainage républicain aux 17 élèves de 3e de la classe UPE2A, qui accueille des élèves arrivés de l'étranger, pour saluer leur parcours exemplaire.","En revenant sur son propre parcours, la ministre les a encouragés : « tout ce qui vaut la peine est difficile, mais tout est possible ». Elle a également salué l'engagement de la communauté éducative et de leur professeur."],"p":[[443,1400,933],[444,1400,933],[445,1400,933],[446,1400,933]]},{"id":"v-france-relance","t":"France Relance","d":"Lundi 10 mai 2021","w":"Sous-préfet chargé du plan de relance  ; Marie Guévenoux, députée","x":["Lors de sa visite aux côtés de la députée Marie Guévenoux, le sous-préfet chargé du plan de relance a confirmé que la Ville bénéficierait de 600 000 € d'aide à l'investissement pour ses écoles. Ce soutien de l'État récompense la démarche de recherche de financements engagée par M. le Maire, les élus et les agents municipaux, dans le cadre du plan « France relance »."],"p":[[447,1400,933],[448,1400,933],[449,1400,933]]},{"id":"v-olivier-veran","t":"Olivier Véran","d":"Lundi 22 mars 2021","w":"Olivier Véran, ministre des Solidarités et de la Santé ; Roxana Maracineanu, ministre déléguée chargée des Sports ; Damien Allouch, maire","x":["Lundi 22 mars 2021, Olivier Véran, ministre des Solidarités et de la Santé, et Roxana Maracineanu, ministre déléguée chargée des Sports, se sont rendus à Épinay-sous-Sénart. En présence de M. le Maire Damien Allouch et de nombreux élus, ils ont rencontré l'équipe d'APA de Géant et les professionnels de la Maison de santé pour échanger sur les bienfaits du sport-santé pour les personnes malades ou en situation de handicap, et annoncer l'ouverture de nouvelles maisons sport-santé.","Olivier Véran a également salué le travail des élus pour la mise en place du centre de vaccination d'Épinay-sous-Sénart."],"p":[[450,1400,933],[451,1400,933],[452,1400,933],[453,1400,933]]},{"id":"v-roxana-maracineanu","t":"Roxana Maracineanu","d":"Vendredi 13 novembre 2020","w":"Roxana Maracineanu, ministre déléguée chargée des Sports ; APA de Géant","x":["Vendredi 13 novembre 2020, Roxana Maracineanu, ministre déléguée chargée des Sports, a rendu visite à l'équipe d'APA de Géant, entreprise spinolienne de l'économie sociale et solidaire spécialisée dans l'activité physique adaptée, à la Maison de santé pluridisciplinaire. Créée en 2016 et labellisée Sport Santé par le ministère, APA de Géant agit pour le sport adapté et pour réduire les inégalités d'accès à la pratique sportive. Une visite vécue comme une belle reconnaissance, ouvrant des perspectives de projets communs avec la ville et le territoire."],"p":[[454,1400,933],[455,1400,933],[456,1400,933],[457,1400,933]]},{"id":"v-inauguration-de-la-mac","t":"Inauguration de la MAC","d":"Samedi 11 mai 2019","w":"Valérie Pécresse, présidente de la Région ; François Durovray, président du Département ; Laure Darcos, sénatrice ; Marie Guévenoux, députée","x":["Samedi 11 mai 2019, devant un parvis comble, la Maison des Arts et de la Culture a été officiellement inaugurée. L'événement s'est déroulé en présence notamment de Valérie Pécresse, présidente de la Région Île-de-France, de François Durovray, président du Conseil départemental de l'Essonne et de la Communauté d'agglomération Val d'Yerres Val de Seine, de la sénatrice Laure Darcos et de la députée Marie Guévenoux, ainsi que de nombreux élus de l'agglomération. Les enfants du Conseil municipal des enfants étaient aussi de la fête."],"p":[[458,1400,933],[459,1400,942],[460,1400,933],[461,1400,933]]}]},"series":{"label":"Séries","kicker":"Reportages et séries","lede":"Sport, carnaval, patrimoine, expositions, bords de l'Yerres : les séries réalisées pour la Ville.","items":[{"id":"s-sport","t":"Sport","d":"2020-2023","w":"Clubs et associations sportives spinoliennes ; éducateurs sportifs de la Ville","x":["Épinay-sous-Sénart, ville sportive : démonstrations des clubs lors des fêtes des associations, Spinol CAN (la « CAN des quartiers » de football organisée par le Football Club d'Épinay au stade Mimoun, juin 2021), championnat K1 light organisé par Boxe en famille au complexe sportif (14 et 15 octobre 2023), SpinBAD, jiu-jitsu brésilien, karaté, activités des éducateurs sportifs de la Ville, course du Téléthon avec les écoles (novembre 2020), dimanche du sport féminin (janvier 2021) et Koh-Lanta du service Jeunesse (été 2020)."],"p":[[680,1400,1400],[681,1400,933],[682,1400,933],[683,1400,933],[684,1400,933],[685,1400,933],[686,1400,933],[687,1400,933]]},{"id":"s-carnaval","t":"Carnaval","d":"2022-2025","w":"Ville d'Épinay-sous-Sénart ; Centre socioculturel Joséphine Baker","x":["Chaque printemps, le carnaval de la Ville part de la place des Cinéastes et défile en musique jusqu'à l'Hôtel de Ville ou au parc de l'Europe, où Monsieur Carnaval est mis à feu.","Portraits d'enfants déguisés et cortèges des éditions 2022 à 2025, dont le premier carnaval du Centre socioculturel Joséphine Baker (mars 2022)."],"p":[[688,1400,933],[689,1400,933],[690,1400,933],[691,1400,933],[692,1400,933],[693,1400,933],[694,1400,933],[695,1400,933]]},{"id":"s-eva-elegancia","t":"Eva Elegancia","d":"26 juin 2025","w":"Eva Elegancia","x":["L'Hôtel de Ville accueille le défilé de la marque Eva Elegancia, imaginée par une styliste tchétchène qui mêle modernité et tradition dans ses collections. Séance photo du 26 juin 2025."],"p":[[696,933,1400],[697,933,1400],[698,933,1400],[699,933,1400],[700,934,1400],[701,933,1400],[702,1400,933],[703,1400,933]]},{"id":"s-eglise-musee-des-arts-et-metiers","t":"Église × Musée des Arts et Métiers","d":"Février 2023","w":"Musée des Arts et Métiers","x":["Dans le cadre du jumelage entre la Ville et le musée des Arts et Métiers, les pièces du musée sont projetées sur la façade de l'église Saint-Damien-de-Veuster, en février 2023 : un musée à ciel ouvert, au cœur de la ville. Grâce à ce jumelage, l'entrée du musée est gratuite pour tous les Spinoliens."],"p":[[704,1400,933],[705,1400,933],[706,1400,933],[707,1400,933],[708,1400,933],[709,1400,933],[710,1400,933],[711,1400,933]]},{"id":"s-art-paix","t":"Art & Paix","d":"16 septembre - 9 octobre 2022","w":"François Pernette (sculptures sur buis)","x":["Pour les Journées européennes du patrimoine 2022, le séminaire orthodoxe russe d'Épinay-sous-Sénart accueille l'exposition « Art et paix » : les sculptures sur buis centenaires de François Pernette, habitant du territoire, qui racontent émotions, rencontres et voyages. Vernissage le vendredi 16 septembre 2022 ; exposition ouverte les week-ends jusqu'au 9 octobre."],"p":[[712,1400,933],[713,1400,933],[714,1400,933],[715,1400,933],[716,1400,933],[717,933,1400],[718,933,1400],[719,1400,933]]},{"id":"s-les-rivieres-pourpres","t":"Les Rivières pourpres","d":"Lundi 7 décembre 2020","w":"Olivier Marchal ; équipe de tournage de la série (France 2)","x":["Lundi 7 décembre 2020, l'équipe de tournage de la série policière « Les Rivières pourpres » (France 2) pose ses caméras sur les bords de l'Yerres, pour des plans des trois derniers épisodes de la saison 3. Reportage sur le plateau, autour d'Olivier Marchal, interprète du commissaire Pierre Niemans."],"p":[[728,1400,933],[729,1400,933],[730,1400,933],[731,1400,933],[732,1400,933],[733,1400,933],[734,1400,933],[735,1400,933]]},{"id":"s-nicolas-henry-la-plaine","t":"Nicolas Henry × La Plaine","d":"2021-2023","w":"Nicolas Henry ; Camille Morelle ; festival Photoclimat","x":["Diplômé des Beaux-Arts de Paris, ancien collaborateur de Yann Arthus-Bertrand pour « 6 milliards d'Autres » et fondateur du festival Photoclimat, le photographe Nicolas Henry présente d'abord à la MAC, du 19 avril au 31 juillet 2021, une double exposition inédite en France sous cette forme : « Les Aventures de Supershaktimaan » et « Kitihawa's Chandelier ».","Après la signature de la convention de renouvellement urbain de La Plaine, le service culturel, avec l'ANRU et les bailleurs sociaux, l'accueille en résidence avec la photographe Camille Morelle : ateliers photo participatifs avec les habitants autour de la mémoire des quartiers, puis atelier avec le Conseil municipal des enfants en novembre 2022.","Point d'orgue : les fresques « Les oiseaux migrateurs », installées sur les façades de La Plaine pour la 2e édition du festival Photoclimat, avec CDC Habitat, Vilogia et ICF La Sablière. Des enfants s'envolent sur le dos d'oiseaux géants, parabole du renouveau et du relogement. Inauguration le 6 décembre 2023.","Reportage : l'exposition à la MAC (2021), l'atelier avec le Conseil municipal des enfants (2022) et les fresques de La Plaine (2023)."],"p":[[736,1400,1033],[737,1400,933],[738,1400,933],[739,1400,933],[740,1400,933],[741,1400,933],[742,1400,933],[743,1400,933]]},{"id":"s-centre-socioculturel-josephine-baker","t":"Centre socioculturel Joséphine Baker","d":"2019-2026","w":"Centre socioculturel Joséphine Baker ; association Abri Handicap","x":["Ouvert au public le 15 février 2021 et inauguré le 9 septembre 2021 au cœur du quartier des Cinéastes, le Centre socioculturel Joséphine Baker est un équipement municipal agréé centre social par la CAF de l'Essonne. « Un lieu pour tous, au service des habitants » : accès aux droits, cours de français, accompagnement numérique, parentalité, accompagnement scolaire, ateliers partagés, sorties familiales et Caravanes de l'été en pied d'immeuble.","Reportages de 2019 à 2026 : le bâtiment avant son ouverture, les Terrasses du CSC (été 2021), les ateliers et les portraits du projet consacré aux femmes (2023), la Journée internationale des droits des femmes, la distribution d'ordinateurs, la chorale, les portes ouvertes de 2023 et du 12 septembre 2026, et la rencontre avec l'association Abri Handicap (juin 2026)."],"p":[[744,1400,935],[745,1400,933],[746,1400,933],[747,1400,933],[748,1400,933],[749,1400,933],[750,1400,933],[751,1400,933]]},{"id":"s-amenagement-des-bords-de-lyerres","t":"Reboisement des bords de l'Yerres","d":"2022-2026","w":"Groupes scolaires, collège La Vallée et lycée Maurice-Eliot","x":["« Le meilleur moment pour planter un arbre était il y a 20 ans. Le deuxième meilleur moment, c'est maintenant. »","En 2022, de nombreux peupliers, malades et victimes d'insectes nuisibles, avaient dû être abattus. Pour les remplacer, environ 1 500 jeunes plants (de 2 ans d'âge) – chênes sessiles et chênes pubescents, aulnes, alisiers, pommiers et poiriers sauvages – ont été mis en terre le long des berges de l'Yerres. Une forêt majestueuse commence ainsi à prendre forme au bout de la prairie derrière la piscine et en contrebas des courts de tennis.","En complément, 29 gaulis (jeunes arbres âgés de 4 à 7 ans, en phase de croissance rapide) ont été plantés tout au long des berges afin d'apporter diversité et présence arborée : des saules blancs, des ormes champêtres et des chênes pubescents. Au niveau du viaduc, un verger municipal composé de 18 arbres fruitiers a été créé : poiriers Nashi, pommiers Belle de Boskoop, merisiers, pruniers et groseilliers à grappes. Il faudra encore quelques années avant de voir apparaître les premières récoltes, mais elles promettent d'être généreuses !","Il faudra des décennies avant que ces arbres atteignent leur âge adulte. Ils représentent l'avenir de la ville, tout comme la jeunesse spinolienne qui a été associée à cette grande opération de plantation. Les groupes scolaires de la commune, ainsi que le collège La Vallée et le lycée Maurice-Eliot, ont chacun parrainé un arbre et envoyé des représentants pour participer à sa mise en terre.","Les élèves grandiront en même temps que ces nouveaux bois, et dans bien des années, au détour d'une promenade, ils se souviendront du jour où ces arbres majestueux étaient encore, comme eux, des jeunes pousses.","Le projet de réaménagement des berges de l'Yerres, conçu avec et pour les Spinoliens, se poursuivra en 2026 avec de nouveaux aménagements, de nouvelles coupes et de nouvelles plantations.","Plus d'informations : page « Les Bords de l'Yerres » du site de la Ville.","Sections de la page : Abattage & reboisement phase 2 · Abattage & reboisement phase 3"],"p":[[752,1400,933],[753,1400,933],[754,1400,933],[755,1400,933],[756,1400,933],[757,1400,933],[758,1400,933],[759,1400,933]]},{"id":"s-maison-des-arts-et-de-la-culture","t":"MAC — Épinay-sous-Sénart","d":"2018-2019","w":"","x":["Sections de la page actuelle : Identité graphique & logo · Des affiches · Les travaux (2018) · L'inauguration (2019) · La Micro-Folie"],"p":[[976,987,1400],[977,990,1400],[978,990,1400],[979,991,1400],[980,1400,933],[981,1400,933],[982,1400,933],[983,1400,933]]},{"id":"s-les-balades-extraordinaires","t":"Les Balades Extraordinaires","d":"Depuis 2023","w":"Festival Rhizomes","x":["Une invitation à redécouvrir les bords de l'Yerres autrement","En partenariat avec le festival Rhizomes, la Ville d'Épinay-sous-Sénart propose Les Balades Extraordinaires, un parcours artistique immersif au cœur des bords de l'Yerres. Cet événement gratuit transforme le paysage en une véritable scène à ciel ouvert où la nature devient le décor vivant d'une expérience poétique et sensorielle.","Au fil d'une promenade d'environ 1 h 30, les visiteurs découvrent des artistes venus de nombreux horizons : musiciens, chanteurs, danseurs, circassiens, acrobates, voltigeurs ou encore installations artistiques disséminées le long du parcours. Entre les arbres, au bord de l'eau ou suspendues dans les airs, les œuvres dialoguent avec le paysage et invitent à porter un regard nouveau sur ce patrimoine naturel exceptionnel.","Pensées pour tous les publics, les Balades Extraordinaires mêlent arts du spectacle vivant, musiques du monde et créations contemporaines dans un format original où chacun avance à son rythme, au gré des rencontres et des découvertes. Chaque édition est unique et fait naître un dialogue sensible entre la création artistique et le vivant.","Après le succès rencontré lors des précédentes éditions, qui ont rassemblé plus de 1 300 visiteurs à Épinay-sous-Sénart dès 2023, ce rendez-vous s'est imposé comme un temps fort de la programmation culturelle estivale de la commune. Il participe également à la valorisation des bords de l'Yerres, offrant une nouvelle manière de découvrir et de s'approprier ce cadre naturel remarquable.","Le festival Rhizomes défend une création artistique ouverte sur le monde, privilégiant la rencontre entre les cultures, les disciplines et les territoires. À travers Les Balades Extraordinaires, il propose une expérience où la musique, la danse, les arts visuels et la nature se répondent pour offrir un moment de contemplation, d'émerveillement et de partage."],"p":[[984,990,1400],[985,1400,933],[986,933,1400],[987,1400,933],[988,1400,933],[989,1400,933],[990,1400,933],[991,933,1400]]},{"id":"s-expo-retrospective-2026","t":"Expo 2025 rétrospective","d":"2025","w":"","x":[],"p":[[992,1400,990],[993,3840,2714],[994,3840,2714],[995,3840,2714],[996,3840,2714],[997,1400,990],[998,3840,2714],[999,3840,2714],[1000,3840,2714],[1001,3840,2714],[1002,1400,990],[1003,3840,2714],[1004,3840,2714],[1005,3840,2714],[1006,3840,2714],[1007,1400,990],[1008,3840,2714],[1009,3840,2714],[1010,3840,2714],[1011,1400,990],[1012,3840,2714],[1013,3840,2714],[1014,3840,2714],[1015,3840,2714],[1016,1400,990],[1017,3840,2714],[1018,3840,2714],[1019,3840,2714],[1020,3840,2714],[1021,1400,990],[1022,3840,2714],[1023,3840,2714],[1024,3840,2714],[1025,3840,2714],[1026,1400,990]]},{"id":"s-expophoto-associations-spinoliennes","t":"Expo 2024 associations spinoliennes","d":"2024","w":"Associations spinoliennes","x":[],"p":[[1027,1400,933],[1028,1920,1165],[1029,1920,1446],[1030,1400,933],[1031,1920,1280],[1032,1920,1280],[1033,1400,933],[1034,1920,1587],[1035,1920,1280],[1036,1400,933],[1037,1920,1280],[1038,1400,933],[1039,1920,1280],[1040,1920,1255],[1041,1400,933],[1042,1920,1280],[1043,1920,1280],[1044,1211,1400],[1045,1920,1280],[1046,1920,1280],[1047,1400,976]]},{"id":"s-expo-retrospective-2024","t":"Expo 2023 rétrospective","d":"2023","w":"","x":[],"p":[[1048,1400,933],[1049,1920,1280],[1050,1920,1280],[1051,1920,1280],[1052,1920,1280],[1053,1920,1280],[1054,1920,1280],[1055,1400,933],[1056,1920,1280],[1057,1920,1280],[1058,1920,1280],[1059,1920,1280],[1060,1920,1280],[1061,1920,1280],[1062,1400,933],[1063,1920,1280],[1064,1920,1280],[1065,1920,1280],[1066,1920,1280],[1067,1920,1280],[1068,1920,1280],[1069,1400,933],[1070,1920,1280],[1071,1920,1280],[1072,1920,1280],[1073,1920,1280],[1074,1920,1280],[1075,1920,1280],[1076,1400,933],[1077,1920,1280],[1078,1920,1280],[1079,1920,1280],[1080,1920,1280],[1081,1920,1280],[1082,1920,1280],[1083,1400,933],[1084,1920,1280],[1085,1920,1280],[1086,1920,1280],[1087,1920,1280],[1088,1920,1280],[1089,1920,1280],[1090,1400,933],[1091,1920,1280],[1092,1920,1280],[1093,1920,1280],[1094,1920,1280],[1095,1920,1280],[1096,1920,1280],[1097,1400,933]]},{"id":"s-spinoliens-expo","t":"Spinoliens [expo]","d":"","w":"Habitants d'Épinay-sous-Sénart","x":["Au détour d'une rue, sur une place ou au coin d'un parc, ces portraits sont nés d'une rencontre, d'un regard, d'un sourire. Réalisées au fil de mes déambulations dans Épinay-sous-Sénart, ces photographies en noir et blanc racontent la richesse humaine de la commune. Enfants, adolescents, adultes ou aînés, visages familiers ou inconnus, toutes les générations et toutes les origines s'y côtoient.","Sans mise en scène, ces portraits capturent un instant de vie, une émotion sincère, une expression, un éclat de rire ou un simple regard. Ils témoignent de ce qui nous rassemble au-delà de nos différences : l'humanité, la bienveillance et le plaisir d'habiter un même territoire.","« Spinoliens » est une invitation à regarder celles et ceux que nous croisons chaque jour avec un regard nouveau. Car derrière chaque visage se cache une histoire, et c'est l'ensemble de ces histoires qui compose l'identité d'Épinay-sous-Sénart."],"p":[[1098,1314,1400],[1099,3840,2560],[1100,3840,2560],[1101,3840,2560],[1102,3840,2560],[1103,3840,2560],[1104,3840,2560],[1105,1400,933],[1106,3840,2560],[1107,3840,2560],[1108,3840,2560],[1109,3840,2560],[1110,3840,2560],[1111,3840,2560],[1112,3840,2560],[1113,1400,933],[1114,3840,2560],[1115,3840,2560],[1116,3840,2560],[1117,3840,2560],[1118,3840,2560],[1119,3840,2560],[1120,1400,933],[1121,3840,2560],[1122,3840,2560],[1123,3840,2560],[1124,3840,2560],[1125,3840,2560],[1126,3840,2560],[1127,3840,2560],[1128,1400,933],[1129,3840,2560],[1130,3840,2560],[1131,3840,2560],[1132,3840,2560],[1133,3840,2560],[1134,3840,2560],[1135,1400,933],[1136,3840,2560],[1137,3840,2560],[1138,3840,2560],[1139,3840,2560],[1140,3840,2560],[1141,3840,2560],[1142,3840,2560],[1143,1400,933],[1144,3840,2560],[1145,3840,2560],[1146,3840,2560],[1147,3840,2560],[1148,3840,2560],[1149,3840,2560],[1150,1400,933]]}]}},"focus":[{"id":"f-tzcld","t":"Territoire zéro chômeur de longue durée","k":"Emploi · 2021-2026","c":"Cinq ans de suivi d'une expérimentation nationale, de la première mobilisation à l'ouverture de Nouvel'R, première entreprise à but d'emploi de l'Essonne. Le récit en huit temps, texte puis images.","hero":[1177,1600,1067],"chiffres":[["2021","engagement de la Ville dans l'expérimentation"],["27 avril 2023","dépôt du dossier d'habilitation"],["2024","habilitation du territoire par l'État"],["14 salariés","en CDI à l'ouverture de Nouvel'R, en mars 2025"]],"sections":[["Le projet",["L'expérimentation Territoire zéro chômeur de longue durée (TZCLD) repose sur trois constats : personne n'est inemployable, ce n'est pas le travail qui manque, ce n'est pas l'argent qui manque. Elle propose aux personnes privées durablement d'emploi un CDI payé au SMIC, à temps choisi, dans une entreprise à but d'emploi (EBE) dont les activités ne concurrencent pas l'existant.","À Épinay-sous-Sénart, la démarche concerne les quartiers de La Plaine et des Cinéastes. Elle a mobilisé des habitants volontaires, un Comité local pour l'emploi réunissant l'État, le Département, l'Agglomération, la Ville et les associations, puis une équipe projet qui a accompagné plus de 70 personnes avant l'ouverture de l'entreprise."]],["Les étapes",["9 novembre 2021 : première « grève du chômage » à Épinay-sous-Sénart et réunion publique d'information.","Printemps 2022 : création du Comité local pour l'emploi. Les vingt premiers volontaires rencontrent plus de 150 Spinoliens pendant l'été.","27 avril 2023 : dépôt officiel du dossier d'habilitation.","2024 : le territoire est habilité par l'État.","Mars 2025 : signature des conventions, remise des premiers contrats et ouverture de Nouvel'R, organisée en trois pôles : cuisine, upcycling, médiation de proximité.","13 mai 2025 : inauguration des locaux. En 2026, Nouvel'R tient le café MAC'Snacks à la Maison des Arts et de la Culture."]],["Ce que j'ai produit",["Un suivi photographique continu depuis 2021 : mobilisations, comités locaux pour l'emploi, dépôt du dossier, signature des conventions, ateliers de couture.","Une série de portraits réalisée dans la ville en 2026, autour des créations de l'atelier upcycling de Nouvel'R.","Les dossiers et articles du Spinomag qui ont accompagné chaque étape, dont la une du n°154 (mai-juin 2022).","Le film « Le projet TZCLD avance ! » et les affiches des temps forts, dont la semaine de portes ouvertes."]]],"galerie":[[1175,1600,1116],[1178,1600,1067],[1176,1067,1600],[1179,1067,1600],[1180,1600,1067],[1181,1463,1600],[1182,1067,1600],[1183,1067,1600],[1184,1600,1067],[1185,1600,1454],[1186,1067,1600],[1171,1600,1067],[1172,1600,1067],[1187,1600,1067],[1188,1600,1067],[1189,1600,1067],[1168,1600,1067],[1169,1600,1067],[1170,1600,1067],[1173,1600,1067],[1174,1600,1067]],"plus":{"aff":[[78,1057,1500]],"couv":[[383,999,1300]],"films":[["Le projet TZCLD avance !","OKRHO7NGanI"]]},"recit":[{"n":"01","k":"Comprendre","d":"Le principe","h":"Faire de l'emploi un droit","x":["L'expérimentation Territoire zéro chômeur de longue durée (TZCLD) repose sur trois constats : **personne n'est inemployable**, **ce n'est pas le travail qui manque**, **ce n'est pas l'argent qui manque**. Plutôt que de financer la privation d'emploi, elle propose aux personnes qui en sont durablement privées un CDI payé au SMIC, à temps choisi, dans une entreprise à but d'emploi (EBE) dont les activités ne concurrencent pas l'existant.","À Épinay-sous-Sénart, la démarche concerne les quartiers de La Plaine et des Cinéastes. Elle s'adresse aux habitants installés depuis plus de six mois, sans activité professionnelle depuis plus d'un an et volontaires pour travailler.","Premier enjeu de communication : rendre lisible un dispositif inhabituel. Le Spinomag l'explique dès octobre 2021, puis lui consacre sa une et un dossier en mai-juin 2022."]},{"pg":1,"img":[[1832,1229,1600,"Spinomag n°151 (octobre 2021), puis une et dossier du n°154 (mai-juin 2022) : expliquer le dispositif"],[383,999,1300,"Spinomag n°151 (octobre 2021), puis une et dossier du n°154 (mai-juin 2022) : expliquer le dispositif"],[1912,2160,1407,"Spinomag n°151 (octobre 2021), puis une et dossier du n°154 (mai-juin 2022) : expliquer le dispositif"]],"leg":"Spinomag n°151 (octobre 2021), puis une et dossier du n°154 (mai-juin 2022) : expliquer le dispositif."},{"n":"02","k":"Mobiliser","d":"2021-2022","h":"Aller chercher les habitants là où ils sont","x":["Le 9 novembre 2021, Épinay-sous-Sénart organise sa première « grève du chômage », rendez-vous national de l'association TZCLD, et une réunion publique d'information. Reconnaissables à leur chasuble bleue, les volontaires vont à la rencontre des habitants, au pied des immeubles et sur le marché.","Au printemps 2022, le Comité local pour l'emploi réunit l'État, le Département, l'Agglomération, la Ville et les associations. Pendant l'été, les vingt premiers volontaires rencontrent plus de 150 Spinoliens. En novembre, une « soupe aux cailloux » est servie aux Cinéastes et au marché pour la nouvelle grève du chômage."]},{"img":[[2578,1600,1067,"Novembre 2021 : les volontaires à la rencontre des habitants"],[2579,1600,1067,"Novembre 2021 : les volontaires à la rencontre des habitants"],[2580,1600,1067,"Novembre 2021 : les volontaires à la rencontre des habitants"]],"leg":"Novembre 2021 : les volontaires à la rencontre des habitants."},{"img":[[1174,1600,1067,"Novembre 2021 : stand sur le marché et réunion publique d'information"],[1169,1600,1067,"Novembre 2021 : stand sur le marché et réunion publique d'information"]],"leg":"Novembre 2021 : stand sur le marché et réunion publique d'information."},{"img":[[2581,1600,1067,"2022 : premières réunions du Comité local pour l'emploi"],[2582,1600,1067,"2022 : premières réunions du Comité local pour l'emploi"]],"leg":"2022 : premières réunions du Comité local pour l'emploi."},{"pg":1,"img":[[1871,2160,1407,"Spinomag n°152, n°155 et n°157 : la mobilisation racontée numéro après numéro"],[1936,1229,1600,"Spinomag n°152, n°155 et n°157 : la mobilisation racontée numéro après numéro"],[2016,2160,1407,"Spinomag n°152, n°155 et n°157 : la mobilisation racontée numéro après numéro"]],"leg":"Spinomag n°152, n°155 et n°157 : la mobilisation racontée numéro après numéro."},{"n":"03","k":"Convaincre","d":"2023-2024","h":"Un dossier, des examinateurs, une habilitation","x":["Le 27 avril 2023, le dossier d'habilitation est officiellement déposé. En juin, les volontaires présentent la démarche et leurs premières réalisations aux élus de l'Agglomération, réunis au centre socioculturel Joséphine Baker. À l'automne, les examinateurs du Fonds d'expérimentation viennent juger sur place de la solidité du projet.","En 2024, le territoire est habilité par l'État. Le Comité local pour l'emploi prépare alors l'entreprise : activités, partenariats, financement."]},{"img":[[1173,1600,1067,"Juin 2023, centre socioculturel Joséphine Baker : les volontaires présentent leurs réalisations aux élus de l'Agglomération"],[2583,1600,1067,"Juin 2023, centre socioculturel Joséphine Baker : les volontaires présentent leurs réalisations aux élus de l'Agglomération"],[2584,1600,1119,"Juin 2023, centre socioculturel Joséphine Baker : les volontaires présentent leurs réalisations aux élus de l'Agglomération"]],"leg":"Juin 2023, centre socioculturel Joséphine Baker : les volontaires présentent leurs réalisations aux élus de l'Agglomération."},{"img":[[1170,1600,1067,"Volontaires, élus et partenaires réunis autour de l'habilitation"],[2585,1600,1067,"Volontaires, élus et partenaires réunis autour de l'habilitation"],[2586,1600,1067,"Volontaires, élus et partenaires réunis autour de l'habilitation"]],"leg":"Volontaires, élus et partenaires réunis autour de l'habilitation."},{"img":[[2587,1600,1067,"2024 : le Comité local pour l'emploi prépare l'ouverture de l'entreprise"],[1168,1600,1067,"2024 : le Comité local pour l'emploi prépare l'ouverture de l'entreprise"]],"leg":"2024 : le Comité local pour l'emploi prépare l'ouverture de l'entreprise."},{"pg":1,"img":[[2066,1229,1600,"Spinomag n°159, n°161 et n°165 : dépôt du dossier, visite du Fonds d'expérimentation, habilitation"],[2067,1229,1600,"Spinomag n°159, n°161 et n°165 : dépôt du dossier, visite du Fonds d'expérimentation, habilitation"],[2123,1229,1600,"Spinomag n°159, n°161 et n°165 : dépôt du dossier, visite du Fonds d'expérimentation, habilitation"],[2238,2160,1407,"Spinomag n°159, n°161 et n°165 : dépôt du dossier, visite du Fonds d'expérimentation, habilitation"]],"leg":"Spinomag n°159, n°161 et n°165 : dépôt du dossier, visite du Fonds d'expérimentation, habilitation."},{"n":"04","k":"Préfigurer","d":"2024","h":"Avant l'entreprise, l'atelier","x":["Pendant près de deux ans, les futurs salariés s'engagent comme bénévoles au sein de l'association de préfiguration Objectif ESS. À l'atelier couture, des bâches publicitaires usagées deviennent sacs, trousses et accessoires : le futur pôle upcycling existe déjà, avant même l'entreprise."]},{"img":[[2588,1600,1067,"L'atelier couture et ses premières créations"],[2589,1600,1067,"L'atelier couture et ses premières créations"]],"leg":"L'atelier couture et ses premières créations."},{"img":[[1171,1600,1067,"De la bâche publicitaire au sac : découpe, piqûre, étiquette"],[1172,1600,1067,"De la bâche publicitaire au sac : découpe, piqûre, étiquette"],[2590,1600,1067,"De la bâche publicitaire au sac : découpe, piqûre, étiquette"]],"leg":"De la bâche publicitaire au sac : découpe, piqûre, étiquette."},{"n":"05","k":"Ouvrir","d":"Mars 2025","h":"Nouvel'R, première entreprise à but d'emploi de l'Essonne","x":["Le 14 mars 2025, dans la salle des mariages de l'Hôtel de Ville, les partenaires signent les conventions et les premiers salariés reçoivent leur contrat de travail : un CDI, à temps choisi. Nouvel'R ouvre avec 14 salariés et trois pôles : cuisine, upcycling, médiation de proximité."]},{"img":[[412,1920,1280,"14 mars 2025 : salariés, élus et partenaires devant l'Hôtel de Ville"]],"leg":"14 mars 2025 : salariés, élus et partenaires devant l'Hôtel de Ville."},{"img":[[2591,1600,1067,"Signature des conventions de partenariat, puis des premiers contrats de travail"],[2592,1600,1067,"Signature des conventions de partenariat, puis des premiers contrats de travail"],[2593,1600,1226,"Signature des conventions de partenariat, puis des premiers contrats de travail"]],"leg":"Signature des conventions de partenariat, puis des premiers contrats de travail."},{"img":[[2594,1600,1067,"Portraits réalisés le jour de la signature"],[2595,1600,1067,"Portraits réalisés le jour de la signature"],[2596,1600,1067,"Portraits réalisés le jour de la signature"]],"leg":"Portraits réalisés le jour de la signature."},{"pg":1,"img":[[2348,1229,1600,"Spinomag n°169 et n°170 : le lancement, puis la présentation de l'entreprise"],[2366,2160,1407,"Spinomag n°169 et n°170 : le lancement, puis la présentation de l'entreprise"]],"leg":"Spinomag n°169 et n°170 : le lancement, puis la présentation de l'entreprise."},{"n":"06","k":"Faire connaître","d":"Mai 2025","h":"Une inauguration et une semaine pour montrer le travail","x":["Le 13 mai 2025, les locaux de Nouvel'R sont inaugurés. Le lendemain, pendant le « Laboratoire des travaux utiles », semaine consacrée au projet, Stéphane Viry, porteur de la proposition de loi visant à pérenniser l'expérimentation, rencontre les acteurs et les volontaires lors d'une table ronde à la Maison des Arts et de la Culture."]},{"img":[[411,1600,1200,"Mai 2025 : inauguration des locaux et visite des ateliers"],[410,1920,1280,"Mai 2025 : inauguration des locaux et visite des ateliers"]],"leg":"Mai 2025 : inauguration des locaux et visite des ateliers."},{"img":[[408,1920,1280,"14 mai 2025 : visite de Stéphane Viry et table ronde à la MAC"],[409,1920,1280,"14 mai 2025 : visite de Stéphane Viry et table ronde à la MAC"]],"leg":"14 mai 2025 : visite de Stéphane Viry et table ronde à la MAC."},{"pg":1,"img":[[2392,2160,1407,"Spinomag n°171 (juillet-août 2025) : l'inauguration"]],"leg":"Spinomag n°171 (juillet-août 2025) : l'inauguration."},{"n":"07","k":"Montrer","d":"Mars 2026","h":"Les créations portées dans la ville","x":["En mars 2026, une semaine de portes ouvertes fait découvrir les ateliers, la cuisine et le café tenu par Nouvel'R à la MAC. Son programme comprend une séance photo en ville : une série de portraits où les sacs et accessoires de l'atelier upcycling sont portés dans les rues, les parcs et les quartiers où ils ont été fabriqués."]},{"img":[[78,1057,1500,"L'affiche de la semaine de portes ouvertes et le groupe réuni devant l'Hôtel de Ville"],[2597,1600,1067,"L'affiche de la semaine de portes ouvertes et le groupe réuni devant l'Hôtel de Ville"]],"leg":"L'affiche de la semaine de portes ouvertes et le groupe réuni devant l'Hôtel de Ville."},{"mur":1,"img":[[1175,1600,1116,"Série de portraits, mars 2026"],[1178,1600,1067,"Série de portraits, mars 2026"],[1176,1067,1600,"Série de portraits, mars 2026"],[1179,1067,1600,"Série de portraits, mars 2026"],[1180,1600,1067,"Série de portraits, mars 2026"],[2598,1600,1396,"Série de portraits, mars 2026"],[2599,1600,1067,"Série de portraits, mars 2026"],[1181,1463,1600,"Série de portraits, mars 2026"],[1182,1067,1600,"Série de portraits, mars 2026"],[1183,1067,1600,"Série de portraits, mars 2026"],[2600,1600,1067,"Série de portraits, mars 2026"],[1184,1600,1067,"Série de portraits, mars 2026"],[2601,1600,1067,"Série de portraits, mars 2026"],[1185,1600,1454,"Série de portraits, mars 2026"],[1186,1067,1600,"Série de portraits, mars 2026"],[2602,1600,1067,"Série de portraits, mars 2026"],[2603,1600,1067,"Série de portraits, mars 2026"],[2604,1600,1067,"Série de portraits, mars 2026"]],"leg":"Série de portraits, mars 2026."},{"n":"08","k":"Écouter","d":"2025-2026","h":"La parole aux volontaires et aux salariés","x":["Sur le site de la Ville, seize témoignages vidéo donnent la parole à celles et ceux qui ont vécu le projet de l'intérieur : dix pendant la mobilisation, six après l'ouverture de Nouvel'R. Leurs titres disent l'essentiel : « Mon premier CDI », « Mon premier salaire », « Avec le travail, je renais »."],"liens":[["Voir les témoignages","https://www.ville-epinay-senart.fr/temoignages-de-lexperimentation-tzcld/"],["La page du projet sur le site de la Ville","https://www.ville-epinay-senart.fr/territoire-zero-chomeur-longue-duree-tzcld/"]]},{"films":[["Le projet TZCLD avance !","OKRHO7NGanI"]]},{"n":"","k":"Bilan","h":"Ce que j'ai produit","liste":["Un suivi photographique continu depuis 2021 : tractages, réunions publiques, comités locaux pour l'emploi, dépôt du dossier, signature des conventions, ateliers, inauguration.","Les articles et dossiers du Spinomag qui ont accompagné chaque étape, dont la une du n°154 (mai-juin 2022).","Une série de portraits réalisée en ville en mars 2026, autour des créations de l'atelier upcycling de Nouvel'R.","Le film « Le projet TZCLD avance ! » et l'affiche de la semaine de portes ouvertes."]}]},{"id":"f-renovation","t":"Rénovation urbaine de La Plaine","k":"Urbanisme · 2021-2026","c":"Un programme de 125 millions d'euros qui transforme un quartier entier. La communication l'accompagne : informer, concerter, garder la mémoire des lieux.","hero":[1195,1600,1067],"chiffres":[["125 M€","budget du programme de renouvellement urbain"],["890","logements à réhabiliter (objectif)"],["285","logements à démolir (objectif)"],["160","logements neufs en accession (objectif)"]],"sections":[["Le projet",["Le Nouveau programme national de renouvellement urbain (NPNRU) du quartier de La Plaine est porté par l'Agence nationale pour la rénovation urbaine (ANRU), l'État, l'Agglomération, la Ville et trois bailleurs sociaux : CDC Habitat, Vilogia et ICF Habitat La Sablière. La convention a été signée le 9 septembre 2021.","Réhabilitations, relogements, démolitions, nouveaux espaces publics : le chantier s'étale sur plusieurs années et touche directement la vie des habitants. Depuis septembre 2026, une concertation sur les espaces publics associe parents d'élèves, seniors, jeunes élus et services."]],["La mémoire du quartier",["De 2021 à 2023, le photographe Nicolas Henry et Camille Morelle ont mené une résidence avec les habitants de La Plaine. Elle a donné lieu à des expositions dans le quartier et aux fresques « Les oiseaux migrateurs », inaugurées le 6 décembre 2023 sur les façades."]],["Ce que j'ai produit",["Le reportage au long cours : visites de l'ANRU, comités de pilotage, réunions et ateliers de concertation, chantiers. 'exposition de Nicolas Henry"],[738,1400,933,"2021 : accrochage et vernissage de l'exposition de Nicolas Henry"]],"leg":"2021 : accrochage et vernissage de l'exposition de Nicolas Henry."},{"img":[[1207,1600,1067,"La résidence : prises de vue avec les habitants et exposition dans le quartier"],[2624,1600,1067,"La résidence : prises de vue avec les habitants et exposition dans le quartier"],[2625,1600,1067,"La résidence : prises de vue avec les habitants et exposition dans le quartier"],[739,1400,933,"La résidence : prises de vue avec les habitants et exposition dans le quartier"]],"leg":"La résidence : prises de vue avec les habitants et exposition dans le quartier."},{"img":[[1203,1600,1067,"Décembre 2023 : les fresques « Les oiseaux migrateurs » sur les façades de La Plaine"],[1204,1600,1067,"Décembre 2023 : les fresques « Les oiseaux migrateurs » sur les façades de La Plaine"],[1205,1600,1067,"Décembre 2023 : les fresques « Les oiseaux migrateurs » sur les façades de La Plaine"],[1206,1600,1067,"Décembre 2023 : les fresques « Les oiseaux migrateurs » sur les façades de La Plaine"]],"leg":"Décembre 2023 : les fresques « Les oiseaux migrateurs » sur les façades de La Plaine."},{"n":"06","k":"Démolir","d":"Novembre 2025","h":"Le 9, villa Offenbach","x":["En novembre 2025, la démolition du 9, villa Offenbach marque une étape visible du programme. Je l'ai photographiée au sol et au drone, pour le magazine, les réseaux sociaux et les archives de la Ville."]},{"img":[[1194,1600,1067,"Novembre 2025 : la démolition vue du sol"],[1193,1600,1067,"Novembre 2025 : la démolition vue du sol"],[2626,1600,1067,"Novembre 2025 : la démolition vue du sol"]],"leg":"Novembre 2025 : la démolition vue du sol."},{"img":[[1196,1600,1067,"Le chantier vu du drone"],[1197,1600,1067,"Le chantier vu du drone"],[1198,1600,1067,"Le chantier vu du drone"]],"leg":"Le chantier vu du drone."},{"films":[["Cœur de Ville, film de présentation","iD4MTK4eys8"]]},{"n":"","k":"Bilan","h":"Ce que j'ai produit","liste":["Le reportage au long cours : visites de l'ANRU, comités de pilotage, réunions et ateliers de concertation, chantiers.","La démolition du 9, villa Offenbach, en novembre 2025, photographiée au sol et au drone.","Les images de la résidence artistique et des fresques.","Les dossiers du Spinomag, dont la une du n°151 (octobre 2021), « De l'ANRU 1 à l'ANRU 2 »."]}]},{"id":"f-yerres","t":"Les bords de l'Yerres","k":"Environnement · 2021-2027","c":"3,8 km de berges classées à réaménager, une peupleraie malade à remplacer : un sujet sensible, expliqué pas à pas aux habitants.","hero":[1224,1600,1067],"chiffres":[["3,8 km","de berges réaménagées"],["+ de 1 500","arbres plantés en 2025"],["2006","classement de la vallée de l'Yerres"],["869 000 €","du Département pour les abords de l'Yerres"]],"sections":[["Le projet",["La vallée de l'Yerres est un site classé depuis 2006. À Épinay-sous-Sénart, les peupliers plantés le long des berges étaient vieillissants, malades et dangereux pour les promeneurs. La Ville a engagé leur remplacement par phases, avec des essences locales, un verger municipal et de nouveaux usages pour les berges.","Après une première campagne d'abattage à l'hiver 2021-2022, puis des diagnostics et une concertation, plus de 1 500 arbres ont été plantés en 2025 avec les écoles. Une deuxième campagne de coupes a eu lieu à l'automne 2026 ; le reboisement est prévu en 2027."]],["Expliquer un abattage",["Couper des arbres dans un site classé ne va pas de soi. La communication a consisté à dire pourquoi, à montrer la suite et à associer les habitants : réunion publique, consultation, atelier participatif, panneaux d'information installés le long des berges."]],["Ce que j'ai produit",["Les panneaux d'information A0 posés sur les berges en 2025 : le projet, les essences, le verger, la biodiversité.","Le film « Réaménagement des bords de l'Yerres » et les images de la crue.","Le suivi photographique des coupes, des plantations avec les scolaires et des réunions, complété par des vues au drone.","Les articles et dossiers du Spinomag consacrés au projet."]]],"galerie":[[1220,1600,1067],[1225,1600,1067],[1226,1600,1067],[1216,1600,1067],[1217,1600,1067],[1215,1600,1067],[1211,1600,1067],[1212,1600,1067],[1213,1067,1600],[1218,1067,1600],[1219,1600,1067],[1214,1600,1067],[752,1400,933],[753,1400,933],[754,1400,933],[755,1400,933],[756,1400,933],[757,1400,933],[758,1400,933],[759,1400,933]],"plus":{"aff":[[6,1060,1500],[7,1060,1500],[9,1060,1500],[12,1060,1500]],"couv":[],"films":[["Réaménagement des bords de l'Yerres","mUHKSPAWDOc"],["Crue de l'Yerres","uFj4KHH3BIo"],["Les Balades extraordinaires","Q1kyP_fz4YQ"]]},"recit":[{"n":"01","k":"Comprendre","d":"Le site","h":"Une vallée classée, des peupliers en fin de vie","x":["La vallée de l'Yerres est un site classé depuis 2006. À Épinay-sous-Sénart, les peupliers plantés le long des 3,8 km de berges dans les années 1990 étaient vieillissants, fragilisés par des insectes ravageurs et dangereux pour les promeneurs. La Ville a engagé leur remplacement par phases, avec des essences locales, un verger municipal et de nouveaux usages pour les berges."]},{"img":[[1220,1600,1067,"La vallée de l'Yerres vue du drone, août 2019"],[1225,1600,1067,"La vallée de l'Yerres vue du drone, août 2019"],[1226,1600,1067,"La vallée de l'Yerres vue du drone, août 2019"]],"leg":"La vallée de l'Yerres vue du drone, août 2019."},{"img":[[2627,1600,1067,"La peupleraie avant les coupes"],[2628,1600,1067,"La peupleraie avant les coupes"]],"leg":"La peupleraie avant les coupes."},{"n":"02","k":"Expliquer","d":"2021-2024","h":"Dire pourquoi avant de couper","x":["Couper des arbres dans un site classé ne va pas de soi. La communication a consisté à dire pourquoi, à montrer la suite et à associer les habitants : réunion publique, consultation, atelier participatif, panneaux d'information installés le long des berges.","De 2022 à 2024, diagnostics, expertises et conception du projet se poursuivent avec les partenaires, dont le SyAGE et le Collectif de sauvegarde de la vallée de l'Yerres."]},{"img":[[2629,1600,1067,"Réunion publique sur l'avenir de la peupleraie"],[2630,1600,1067,"Réunion publique sur l'avenir de la peupleraie"]],"leg":"Réunion publique sur l'avenir de la peupleraie."},{"img":[[1214,1600,1067,"Balade et atelier participatif sur les berges"],[2631,1600,1067,"Balade et atelier participatif sur les berges"],[2632,1600,1067,"Balade et atelier participatif sur les berges"]],"leg":"Balade et atelier participatif sur les berges."},{"pg":1,"img":[[1747,1229,1600,"Spinomag n°148 (février 2021) et n°155 (été 2022) : sécuriser, puis concevoir le réaménagement"],[1960,1229,1600,"Spinomag n°148 (février 2021) et n°155 (été 2022) : sécuriser, puis concevoir le réaménagement"]],"leg":"Spinomag n°148 (février 2021) et n°155 (été 2022) : sécuriser, puis concevoir le réaménagement."},{"n":"03","k":"Couper","d":"2022-2025","h":"Un abattage par phases","x":["Une première campagne d'abattage sécurise les cheminements en 2022. En 2025, deux parcelles sont coupées à blanc et préparées pour la replantation. Une deuxième campagne a eu lieu à l'automne 2026 sur de nouvelles parcelles."]},{"img":[[1216,1600,1067,"Première campagne d'abattage"],[1217,1600,1067,"Première campagne d'abattage"],[2633,1600,1067,"Première campagne d'abattage"]],"leg":"Première campagne d'abattage."},{"img":[[1215,1600,1067,"2025 : les parcelles préparées avant replantation, au sol et vues du drone"],[2634,1600,1067,"2025 : les parcelles préparées avant replantation, au sol et vues du drone"],[2635,1600,1067,"2025 : les parcelles préparées avant replantation, au sol et vues du drone"]],"leg":"2025 : les parcelles préparées avant replantation, au sol et vues du drone."},{"n":"04","k":"Replanter","d":"2025","h":"Plus de 1 500 arbres, plantés avec les écoles","x":["En 2025, plus de 1 500 arbres sont plantés et un verger municipal est créé. Chaque groupe scolaire, le collège La Vallée et le lycée Maurice Eliot parrainent un arbre. Le prochain reboisement, avec des essences diversifiées, est prévu en 2027."]},{"img":[[1211,1600,1067,"2025 : plantations avec les scolaires"],[1212,1600,1067,"2025 : plantations avec les scolaires"],[1213,1067,1600,"2025 : plantations avec les scolaires"]],"leg":"2025 : plantations avec les scolaires."},{"img":[[753,1400,933,"Sur les parcelles replantées"],[754,1400,933,"Sur les parcelles replantées"],[755,1400,933,"Sur les parcelles replantées"]],"leg":"Sur les parcelles replantées."},{"n":"05","k":"Informer","d":"2025","h":"Des panneaux au bord de l'eau","x":["Pour que l'explication reste sur place, quatre panneaux d'information au format A0 sont posés le long des berges en 2025 : le projet, les essences, le verger, la biodiversité. Le Spinomag suit chaque étape."]},{"pg":1,"img":[[6,1060,1500,"Les quatre panneaux A0 installés sur les berges"],[7,1060,1500,"Les quatre panneaux A0 installés sur les berges"],[9,1060,1500,"Les quatre panneaux A0 installés sur les berges"],[12,1060,1500,"Les quatre panneaux A0 installés sur les berges"]],"leg":"Les quatre panneaux A0 installés sur les berges."},{"pg":1,"img":[[2348,1229,1600,"Spinomag n°169 et n°171 (2025)"],[2392,2160,1407,"Spinomag n°169 et n°171 (2025)"]],"leg":"Spinomag n°169 et n°171 (2025)."},{"n":"06","k":"Montrer","d":"La rivière","h":"L'Yerres en images, crue comprise","x":["La rivière se raconte aussi par ses humeurs : la crue de l'hiver 2021, filmée et photographiée, rappelle pourquoi les berges doivent rester un espace naturel."]},{"img":[[1218,1067,1600,"La crue de l'Yerres, hiver 2021"],[1219,1600,1067,"La crue de l'Yerres, hiver 2021"],[2636,1600,1067,"La crue de l'Yerres, hiver 2021"]],"leg":"La crue de l'Yerres, hiver 2021."},{"films":[["Réaménagement des bords de l'Yerres","mUHKSPAWDOc"],["Crue de l'Yerres","uFj4KHH3BIo"],["Les Balades extraordinaires","Q1kyP_fz4YQ"]]},{"n":"","k":"Bilan","h":"Ce que j'ai produit","liste":["Les panneaux d'information A0 posés sur les berges en 2025 : le projet, les essences, le verger, la biodiversité.","Le film « Réaménagement des bords de l'Yerres » et les images de la crue.","Le suivi photographique des coupes, des plantations avec les scolaires et des réunions, complété par des vues au drone.","Les articles et dossiers du Spinomag consacrés au projet."]}]},{"id":"f-mac","t":"La Maison des Arts et de la Culture","k":"Culture · 2019-2026","c":"Une salle de 400 places, une Micro-Folie, des expositions, des ateliers : l'image d'un équipement culturel, saison après saison.","hero":[1228,1600,1067],"chiffres":[["400 / 700","places assises / debout, salle Eugène-Ritt"],["24","rendez-vous à l'agenda de la saison 2026/2027"],["11","expositions programmées en 2026/2027"],["57","spectacles photographiés présentés ici"]],"sections":[["L'équipement",["La Maison des Arts et de la Culture (MAC) réunit une salle de spectacle, des ateliers de pratique artistique, des espaces d'exposition, un musée numérique Micro-Folie et un café. Chaque saison mêle têtes d'affiche, compagnies en résidence, festival jeune public et rendez-vous gratuits."]],["Une identité de saison",["Chaque année, la brochure de saison donne le ton : une illustration de couverture, déclinée sur les affiches des spectacles, des expositions et des conférences de la Micro-Folie. L'ensemble forme une collection reconnaissable dans la ville."]],["Ce que j'ai produit",["Les brochures de saison et leurs couvertures, de 2021/2022 à 2026/2027.","Les affiches des spectacles, des expositions, du festival « Dans ma tête » et de la Micro-Folie.","La photographie de scène : concerts, théâtre, danse, cirque, résidences.","Des captations et des films : concerts, série « Carte Blanche », rétrospectives."]]],"galerie":[[1227,1600,1067],[1229,1600,1067],[1231,1600,1067],[482,1400,933],[483,1400,933],[466,1400,933],[467,1400,933],[537,1400,933],[538,1400,933],[656,1400,933],[657,1400,933],[580,1400,933],[581,1400,933],[596,1400,933],[597,1400,933],[569,1400,933]],"pl
