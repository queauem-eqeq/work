<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emmanuel Quéau, portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Mise en page : l'image d'abord, pleine largeur ; le texte en colonne étroite ; un seul accent rouge. */
  --noir:#0b0b0c; --encre:#141416; --trait:#2a2a2e; --papier:#f3f0ea; --gris:#9a968f; --rouge:#ff2d3f;
  --titre:"Instrument Serif","Times New Roman",serif; --texte:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --g:clamp(16px,4vw,56px);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--noir);color:var(--papier);font-family:var(--texte);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%;height:auto}
img{opacity:1}.hero img{opacity:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--rouge);outline-offset:3px}
h1,h2,h3{font-family:var(--titre);font-weight:400;line-height:1.02;text-wrap:balance;letter-spacing:-.01em}
.cap{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gris)}
.cap b{color:var(--rouge);font-weight:600}
.wrap{padding-inline:var(--g)}
.col{max-width:68ch}

/* en-tête */
header{position:fixed;inset:0 0 auto 0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px var(--g);background:linear-gradient(#0b0b0cee,#0b0b0c00);transition:background .3s}
header.plein{background:#0b0b0cf2;border-bottom:1px solid var(--trait)}
.nom{font-family:var(--titre);font-size:24px;white-space:nowrap}
.nom i{color:var(--rouge);font-style:normal}
nav{display:flex;gap:clamp(10px,1.6vw,26px);flex-wrap:wrap;justify-content:flex-end}
nav a{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#d8d4cc;padding:6px 0;border-bottom:2px solid transparent}
nav a:hover,nav a.on{color:#fff;border-color:var(--rouge)}
#burger{display:none;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:8px 0}
@media(max-width:900px){
  #burger{display:block}
  nav{position:fixed;inset:0;background:#0b0b0cfa;flex-direction:column;justify-content:center;align-items:flex-start;padding:var(--g);gap:6px;display:none}
  nav.ouvert{display:flex}
  nav a{font-family:var(--titre);font-size:34px;letter-spacing:0;text-transform:none;font-weight:400}
  #burger{position:relative;z-index:2}
}

/* accueil */
.hero{position:relative;height:min(92vh,900px);min-height:520px;overflow:hidden;background:#000}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease}
.hero img.ok{opacity:0}.hero img.on.ok{opacity:1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0b0b0c55 0%,#0b0b0c00 30%,#0b0b0c00 45%,#0b0b0cf5 100%)}
.hero .txt{position:absolute;z-index:2;left:var(--g);right:var(--g);bottom:clamp(28px,6vh,70px)}
.hero h1{font-size:clamp(54px,11vw,170px);line-height:.9}
.hero h1 em{color:var(--rouge)}
.metiers{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:18px;font-size:clamp(13px,1.3vw,16px);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.metiers span+span::before{content:"";display:inline-block;width:22px;height:2px;background:var(--rouge);vertical-align:middle;margin-right:22px}
.intro{display:grid;grid-template-columns:minmax(0,3fr) minmax(240px,1fr);gap:clamp(24px,5vw,90px);padding-block:clamp(48px,8vw,120px);align-items:start}
.intro p.g{font-family:var(--titre);font-size:clamp(28px,3.6vw,54px);line-height:1.08}
.intro p.g em{color:var(--rouge)}
.trois{display:grid;gap:26px}
.trois h3{font-size:30px;margin-bottom:4px}
.trois p{color:#cfcbc3;font-size:16px}
@media(max-width:800px){.intro{grid-template-columns:1fr}}

section.bloc{padding-block:clamp(36px,6vw,90px)}
.tete{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:clamp(18px,3vw,36px);flex-wrap:wrap}
.tete h2{font-size:clamp(40px,6.5vw,96px)}
.lien{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;border-bottom:2px solid var(--rouge);padding-bottom:4px;white-space:nowrap}
.lien:hover{color:var(--rouge)}

/* cartes projets */
.projets{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.pj{position:relative;overflow:hidden;background:var(--encre);grid-column:span 3;aspect-ratio:4/5}
.pj:nth-child(1),.pj:nth-child(2){grid-column:span 6;aspect-ratio:3/2}
.pj img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.7,.2,1),filter .4s}
.pj::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 35%,#000d 100%)}
.pj:hover img{transform:scale(1.045)}
.pj .l{position:absolute;z-index:2;left:22px;right:22px;bottom:20px}
.pj h3{font-size:clamp(24px,2.5vw,40px);margin-top:6px}
.pj .cap{color:#e9e5dd}
@media(max-width:900px){.projets{grid-template-columns:1fr 1fr}.pj,.pj:nth-child(1),.pj:nth-child(2){grid-column:span 1;aspect-ratio:4/5}}
@media(max-width:560px){.projets{grid-template-columns:1fr}.pj,.pj:nth-child(1),.pj:nth-child(2){aspect-ratio:4/3}}

/* rubans défilants */
.ruban{display:flex;gap:6px;overflow-x:auto;padding-inline:var(--g);scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--trait) transparent}
.ruban>*{flex:0 0 auto;scroll-snap-align:start}
.ruban img{height:clamp(240px,34vw,460px);width:auto;background:var(--encre)}
.ruban.bas img{height:clamp(200px,26vw,360px)}

/* tuiles photo */
.tuiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tu{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--encre)}
.tu img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.tu:hover img{transform:scale(1.045)}
.tu::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 45%,#000c)}
.tu .l{position:absolute;z-index:2;left:20px;right:20px;bottom:18px}
.tu h3{font-size:clamp(26px,3vw,44px)}
@media(max-width:700px){.tuiles{grid-template-columns:1fr}.tu{aspect-ratio:4/3}}

/* pages */
main{min-height:80vh}
.page-tete{padding:clamp(110px,16vw,200px) var(--g) clamp(24px,4vw,48px)}
.page-tete h1{font-size:clamp(52px,10vw,150px);margin-top:10px}
.page-tete p.c{font-size:clamp(18px,2vw,24px);color:#d8d4cc;max-width:60ch;margin-top:20px}
.retour{display:inline-block;margin-bottom:22px}
.plein-img{width:100%;height:auto;max-height:92vh;object-fit:cover;background:var(--encre);cursor:zoom-in}
.chiffres{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--trait);margin-block:clamp(28px,5vw,60px)}
.chiffres div{padding:26px 22px 26px 0;border-right:1px solid var(--trait);margin-right:22px}
.chiffres div:last-child{border:0;margin:0}
.chiffres b{display:block;font-family:var(--titre);font-weight:400;font-size:clamp(34px,4.4vw,64px);line-height:1;color:var(--papier);font-variant-numeric:tabular-nums}
.chiffres span{display:block;margin-top:8px;font-size:14px;color:var(--gris);max-width:24ch}
@media(max-width:800px){.chiffres{grid-template-columns:1fr 1fr}.chiffres div{border-right:0;margin:0;border-bottom:1px solid var(--trait)}}
.sections{display:grid;gap:clamp(30px,5vw,60px)}
.sec{display:grid;grid-template-columns:minmax(180px,1fr) 3fr;gap:clamp(16px,4vw,60px)}
.sec h2{font-size:clamp(28px,3vw,42px)}
.sec p,.sec li{max-width:68ch;color:#e4e0d8}
.sec p+p{margin-top:14px}
.sec ul{list-style:none;display:grid;gap:12px}
.sec li{padding-left:26px;position:relative}
.sec li::before{content:"";position:absolute;left:0;top:.72em;width:14px;height:2px;background:var(--rouge)}
@media(max-width:800px){.sec{grid-template-columns:1fr}}

/* grilles d'images justifiées */
.rangs{display:flex;flex-direction:column;gap:6px;margin-top:clamp(28px,5vw,60px)}
.rang{display:flex;gap:6px}
.rang a{display:block;min-width:0;background:var(--encre);overflow:hidden;cursor:zoom-in}
.rang img{width:100%;height:100%;object-fit:cover;transition:opacity .3s}
.rang a:hover img{opacity:.86}
.mur{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(150px,17vw,250px),1fr));gap:6px}
.mur a{display:block;background:var(--encre);cursor:zoom-in;position:relative;overflow:hidden}
.mur img{width:100%;height:auto;transition:transform .5s}
.mur a:hover img{transform:scale(1.03)}
.mur .leg{padding:10px 2px 16px}
.mur .leg b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.mur .leg span{font-size:13px;color:var(--gris)}

/* index de fiches */
.fiches{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(240px,24vw,380px),1fr));gap:6px 6px}
.fi{display:block;background:var(--encre)}
.fi .im{aspect-ratio:3/2;overflow:hidden}
.fi img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.fi:hover img{transform:scale(1.05)}
.fi .l{padding:12px 14px 20px}
.fi h3{font-size:26px;line-height:1.05}
.fi .cap{display:block;margin-top:6px;font-size:11px}
.onglets{display:flex;gap:clamp(10px,1.5vw,24px);flex-wrap:nowrap;white-space:nowrap;margin-bottom:26px}
@media(max-width:800px){.onglets{flex-wrap:wrap;gap:8px 16px}}
.onglets a{font-family:var(--titre);font-size:clamp(19px,2.1vw,32px);color:var(--gris);border-bottom:2px solid transparent}
.onglets a.on{color:var(--papier);border-color:var(--rouge)}

/* vidéos */
.films{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(240px,24vw,360px),1fr));gap:22px 6px}
.film .v{aspect-ratio:16/9;background:var(--encre) center/cover;position:relative;overflow:hidden;display:block}
.film .v::after{content:"";position:absolute;left:14px;bottom:14px;width:0;height:0;border-left:16px solid #fff;border-block:10px solid transparent;filter:drop-shadow(0 1px 6px #000)}
.film .v:hover{filter:brightness(1.12)}
.film .v .n{position:absolute;right:12px;top:6px;font-family:var(--titre);font-size:54px;color:#ffffff22}
.film h3{font-size:24px;margin-top:10px;line-height:1.08}
.film p{font-size:14px;color:#bdb9b1;margin-top:6px;max-width:44ch}
.note{font-size:14px;color:var(--gris);margin-top:14px}

/* à propos */
.apropos{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(24px,6vw,100px)}
.apropos h2{font-size:34px;margin:34px 0 14px}
.exp{border-top:1px solid var(--trait);padding:18px 0}
.exp b{display:block;font-size:18px}
.exp .cap{display:block;margin-bottom:6px}
.exp p,.exp li{color:#d8d4cc;font-size:16px}
.exp ul{list-style:none;margin-top:8px;display:grid;gap:6px}
.puces{display:flex;flex-wrap:wrap;gap:8px}
.puces span{border:1px solid var(--trait);padding:7px 12px;font-size:14px}
.contact a{display:block;font-family:var(--titre);font-size:clamp(26px,3vw,40px);border-bottom:1px solid var(--trait);padding:12px 0}
.contact a:hover{color:var(--rouge)}
@media(max-width:800px){.apropos{grid-template-columns:1fr}}

footer{border-top:1px solid var(--trait);margin-top:clamp(50px,8vw,120px);padding:28px var(--g) 40px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--gris);font-size:14px}

/* visionneuse */
#lb{position:fixed;inset:0;z-index:100;background:#000000f2;display:none;align-items:center;justify-content:center;padding:56px 76px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb button{position:absolute;color:#fff;font-size:34px;width:60px;height:60px;display:grid;place-items:center}
#lb .x{top:6px;right:8px}#lb .p{left:8px;top:50%;transform:translateY(-50%)}#lb .s{right:8px;top:50%;transform:translateY(-50%)}
#lb .c{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:13px;color:var(--gris);letter-spacing:.1em}
@media(max-width:700px){#lb{padding:56px 10px 60px}#lb .p,#lb .s{top:auto;bottom:2px;transform:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ajouts */
.h2b{font-size:clamp(30px,4vw,56px)}
.sst{font-family:var(--titre);font-size:clamp(22px,2.2vw,30px);margin:26px 0 8px;color:var(--papier)}
.sec p b,.col p b{color:#fff;font-weight:600}
.poeme{font-family:var(--titre);font-size:min(5.1vw,46px);line-height:1.22;margin:clamp(34px,6vw,70px) 0 clamp(10px,2vw,20px);padding-left:clamp(10px,2vw,28px);border-left:3px solid var(--rouge);display:grid;gap:0}
.poeme span{display:block;white-space:nowrap}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(150px,19vw,280px),1fr));gap:8px;align-items:start;margin-top:10px}
.pages a{display:block;background:var(--encre);cursor:zoom-in;box-shadow:0 1px 0 #ffffff14}
.pages img{width:100%;height:auto;transition:opacity .3s}
.pages a:hover img{opacity:.85}
.fi .im.vide{background:linear-gradient(135deg,#17171b,#0f0f12);position:relative}
.fi .im.vide::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%) rotate(45deg);border:2px solid var(--rouge);opacity:.5}
.note a.lien{margin-right:10px}

/* lecteur video en superposition */
#vb{position:fixed;inset:0;z-index:110;background:#000000f5;display:none;align-items:center;justify-content:center;padding:clamp(8px,3vw,48px)}
#vb.on{display:flex}
#vb .cadre{width:min(100%,177.7778vh);width:min(100%,177.7778dvh);aspect-ratio:16/9;max-height:100%;background:#000;box-shadow:0 20px 60px #000}
#vb iframe{width:100%;height:100%;border:0;display:block}
#vb .x{position:absolute;top:4px;right:8px;color:#fff;font-size:34px;width:56px;height:56px;display:grid;place-items:center}
#vb .t{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:13px;color:var(--gris);letter-spacing:.08em;padding-inline:60px}

/* telephone bascule en paysage : l'image et le film prennent toute la hauteur */
@media (orientation:landscape) and (max-height:560px){
  #lb{padding:4px 52px}
  #lb button{width:46px;height:46px;font-size:28px}
  #lb .x{top:0;right:0}
  #lb .p{left:0;top:50%;bottom:auto;transform:translateY(-50%)}
  #lb .s{right:0;top:50%;bottom:auto;transform:translateY(-50%)}
  #lb .c{bottom:2px;font-size:11px}
  #vb{padding:2px}
  #vb .x{top:0;right:0;width:46px;height:46px;font-size:28px}
  #vb .t{display:none}
}

/* largeur maximale : le site reste centre sur les grands ecrans */
:root{--max:1500px}
main{max-width:var(--max);margin-inline:auto}
header,footer{padding-inline:max(var(--g),calc((100vw - var(--max))/2 + var(--g)))}

/* au plus trois elements de front, quatre pour les dossiers Focus */
.projets{grid-template-columns:repeat(3,1fr)}
.pj,.pj:nth-child(1),.pj:nth-child(2){grid-column:span 1;aspect-ratio:3/4}
.fiches,.films{grid-template-columns:repeat(3,1fr)}
@media(max-width:1200px){.projets{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1000px){
  .fiches,.films{grid-template-columns:repeat(2,1fr)}
  .projets{grid-template-columns:repeat(2,1fr)}
  .pj,.pj:nth-child(1),.pj:nth-child(2){grid-column:span 1;aspect-ratio:4/5}
}
@media(max-width:620px){
  .fiches,.films{grid-template-columns:1fr}
  .projets{grid-template-columns:1fr}
  .pj,.pj:nth-child(1),.pj:nth-child(2){aspect-ratio:4/3}
}

/* bandeau d'affiches, a la place des chiffres cles */
.bandeau{display:flex;gap:10px;flex-wrap:nowrap;overflow-x:auto;border-block:1px solid var(--trait);padding-block:22px;margin-block:clamp(24px,4vw,46px)}
.bandeau a{flex:0 0 auto;display:block;background:var(--encre)}
.bandeau img{height:clamp(190px,24vw,320px);width:auto}
.bandeau.dip{border-top:0;padding-top:0;margin-top:calc(-1 * clamp(24px,4vw,46px) + 10px)}
.bandeau.dip img{height:clamp(150px,19vw,250px)}
/* galerie en grille reguliere */
.grille{display:grid;gap:8px;margin-top:clamp(28px,5vw,60px);align-items:start}
.grille a{display:block;background:var(--encre);cursor:zoom-in;overflow:hidden}
.grille div{background:var(--encre);overflow:hidden}
.grille img{width:100%;height:auto;transition:opacity .3s}
.grille a:hover img{opacity:.85}
@media(max-width:900px){.grille{grid-template-columns:repeat(3,1fr)!important}}
@media(max-width:560px){.grille{grid-template-columns:repeat(2,1fr)!important}}

/* dossier en recit : chapitres de texte et temps d'images alternes */
.somm{display:flex;flex-wrap:wrap;gap:8px 10px;margin-bottom:clamp(40px,7vw,90px)}
.somm button{border:1px solid var(--trait);padding:8px 14px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#d8d4cc;transition:border-color .2s,color .2s}
.somm button b{color:var(--rouge);font-weight:600;margin-right:4px}
.somm button:hover{border-color:var(--rouge);color:#fff}
.recit{display:grid;gap:clamp(26px,4vw,52px)}
.chap{scroll-margin-top:90px;padding-top:clamp(34px,6vw,84px);border-top:1px solid var(--trait)}
.chap:first-child{padding-top:0;border-top:0}
.chap .num>b{display:block;font-family:var(--titre);font-weight:400;font-size:clamp(64px,9vw,140px);line-height:.82;color:var(--papier);margin-bottom:14px;font-variant-numeric:tabular-nums}
.chap h2{font-size:clamp(32px,4.4vw,62px);margin-bottom:clamp(14px,2vw,24px);max-width:20ch}
.chap p{font-size:clamp(17px,1.35vw,19px)}
.chap .liens{display:flex;gap:14px 28px;flex-wrap:wrap;margin-top:26px}
.suite{display:flex;justify-content:space-between;gap:18px 40px;flex-wrap:wrap;margin-top:clamp(70px,10vw,140px);padding-top:28px;padding-bottom:clamp(40px,6vw,90px);border-top:1px solid var(--trait)}
.phase .rangs{margin-top:0}
.liens.phase{display:flex;gap:14px 28px;flex-wrap:wrap;margin-top:-6px}
.reperes{border-block:1px solid var(--trait);padding-block:16px;margin-bottom:clamp(24px,4vw,44px);display:grid;gap:6px}
.reperes span{font-size:15px;color:#d8d4cc}
.visite{display:grid;gap:clamp(22px,3.4vw,44px)}
.visite .col p{font-size:clamp(17px,1.35vw,19px)}
.phase figcaption{margin-top:12px;line-height:1.5;max-width:90ch}
.phase.pg .rang a{box-shadow:0 0 0 1px var(--trait)}
.films.phase{margin-top:6px}
@media(max-width:800px){.chap .num{display:flex;align-items:baseline;gap:14px}.chap .num>b{font-size:64px;margin:0}}
</style>
</head>
<body>
<header id="hd">
  <a class="nom" href="#accueil">Emmanuel Quéau<i>.</i></a>
  <button id="burger" aria-expanded="false" aria-controls="menu">Menu</button>
  <nav id="menu"></nav>
</header>
<main id="app"></main>
<footer><span>Emmanuel Quéau · Communication, graphisme, photographie, vidéo</span><span>queau.emm@gmail.com · 06 25 75 70 22</span></footer>
<div id="vb" role="dialog" aria-label="Lecteur video" aria-modal="true"><button class="x" aria-label="Fermer la video">×</button><div class="cadre"></div><div class="t"></div></div>
<div id="lb" role="dialog" aria-label="Visionneuse"><button class="x" aria-label="Fermer">×</button><button class="p" aria-label="Image précédente">‹</button><img alt=""><button class="s" aria-label="Image suivante">›</button><div class="c"></div></div>
<script>/* données toujours à jour : l'adresse change chaque minute, le navigateur ne ressert donc jamais une ancienne copie */document.write('<script src="data.js?v='+Math.floor(Date.now()/6e4)+'"><\/script>')</script>
<script>
const MENU=[["focus","Focus"],["edition","Édition"],["photo","Photo"],["ia","IA"],["video","Vidéo"],["archives","Archives"],["a-propos","À propos"]];
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* **gras** et « ### intertitre » dans les textes longs */
const rich=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/«\s*([^»]{2,40})\s*»/g,"«&nbsp;$1&nbsp;»");
function para(x){ if(x.startsWith("### "))return `<h3 class="sst">${rich(x.slice(4))}</h3>`;
  if(x.startsWith("• "))return `<ul><li>${rich(x.slice(2))}</li></ul>`;
  if(x===x.toUpperCase()&&x.length<60)return `<p class="cap" style="margin-top:22px">${esc(x)}</p>`;
  return `<p>${rich(x)}</p>`}
function hydrate(){}
let LB=[],LBi=0,LBtitre="",aRouter=false;
const ouvert=()=>$("#lb").classList.contains("on")||$("#vb").classList.contains("on");
function apresFermeture(){if(aRouter){aRouter=false;route()}}
function img(p,alt="",cls=""){return `<img src="s/${p[0]}.webp" width="${p[1]}" height="${p[2]}" alt="${esc(alt)}" loading="lazy" decoding="async" class="ok${cls?" "+cls:""}">`}
function big(p,alt=""){return `<img src="i/${p[0]}.webp" width="${p[1]}" height="${p[2]}" alt="${esc(alt)}" loading="lazy" decoding="async" class="ok">`}

function rangs(list,start=0,cible,hd){
  const w=innerWidth, per=cible||(w<700?2:3); let h="",i=0,n=0;
  const motif=w<700?[1,2,2]:[2,3,1,3,2,3];
  while(i<list.length){
    let k=cible?per:motif[n%motif.length]; n++;
    const row=list.slice(i,i+k);
    if(row.length===1&&row[0][1]<row[0][2]&&i+1<list.length){row.push(list[i+1])}
    const hmax=row.length===1?"max-height:88vh;":"";
    h+=`<div class="rang">`+row.map((p,j)=>`<a href="#" data-lb="${start+i+j}" style="flex:${(p[1]/p[2]).toFixed(4)} 1 0;aspect-ratio:${p[1]}/${p[2]};${hmax}">${row.length===1||hd?big(p):img(p)}</a>`).join("")+`</div>`;
    i+=row.length;
  }
  return `<div class="rangs">${h}</div>`;
}
const SD=new Set(D.sd||[]),hd=i=>`${SD.has(i)?"s":"i"}/${i}.webp`;
function lier(list){LB=list;LBtitre="";app.querySelectorAll("[data-lb]").forEach(a=>a.onclick=e=>{e.preventDefault();ouvrir(+a.dataset.lb)})}
function ouvrir(i){LBi=(i+LB.length)%LB.length;const p=LB[LBi];const im=$("#lb img");im.style.opacity=.3;im.onload=()=>im.style.opacity=1;im.src=hd(p[0]);new Image().src=hd(LB[(LBi+1)%LB.length][0]);$("#lb .c").textContent=(p[3]?p[3]+" · ":LBtitre?LBtitre+" · ":"")+`${LBi+1} / ${LB.length}`;$("#lb").classList.add("on")}
function fermerLB(){$("#lb").classList.remove("on");apresFermeture()}
$("#lb .x").onclick=fermerLB;
$("#lb .p").onclick=()=>ouvrir(LBi-1);$("#lb .s").onclick=()=>ouvrir(LBi+1);
$("#lb").onclick=e=>{if(e.target.id==="lb")fermerLB()};
addEventListener("keydown",e=>{
  if($("#vb").classList.contains("on")){if(e.key==="Escape")fermerFilm();return}
  if(!$("#lb").classList.contains("on"))return;
  if(e.key==="Escape")fermerLB();if(e.key==="ArrowLeft")ouvrir(LBi-1);if(e.key==="ArrowRight")ouvrir(LBi+1)});
let tx=0;$("#lb").addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
$("#lb").addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)ouvrir(LBi+(d<0?1:-1))});

const yt=id=>id.startsWith("v:")?`https://vimeo.com/${id.slice(2)}`:`https://www.youtube.com/watch?v=${id}`;
const vig=id=>`data-y="${id}"`+(D.thumbs[id]?` style="background-image:url(${D.thumbs[id]})"`:"");
function vignettes(){document.querySelectorAll(".v[data-y]").forEach(a=>{const u=D.thumbs[a.dataset.y];if(u)a.style.backgroundImage=`url(${u})`})}
fetch("t.json").then(r=>r.json()).then(j=>{D.thumbs=j;vignettes()}).catch(()=>{});
function ouvrirDoc(key){const d=D.docs[key];if(!d)return;LB=d.p;LBtitre=d.t;ouvrir(0)}
addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[data-doc]");
  if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;e.preventDefault();ouvrirDoc(a.dataset.doc)});
function lireFilm(id,titre){
  const src=id.startsWith("v:")?`https://player.vimeo.com/video/${id.slice(2)}?autoplay=1&title=0&byline=0&portrait=0&dnt=1`:`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
  $("#vb .cadre").innerHTML=`<iframe src="${src}" title="${esc(titre||"Film")}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  $("#vb .t").textContent=titre||"";$("#vb").classList.add("on");
}
function fermerFilm(){$("#vb").classList.remove("on");$("#vb .cadre").innerHTML="";$("#vb .t").textContent="";apresFermeture()}
$("#vb .x").onclick=fermerFilm;
$("#vb").onclick=e=>{if(e.target.id==="vb")fermerFilm()};
addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a.v[data-film]");
  if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;e.preventDefault();lireFilm(a.dataset.film,a.dataset.titre)});
function film(f,n){return `<div class="film"><a class="v" href="${yt(f.y)}" target="_blank" rel="noopener" data-film="${esc(f.y)}" data-titre="${esc(f.t)}" ${vig(f.y)} aria-label="Voir « ${esc(f.t)} »"><span class="n">${String(n).padStart(2,"0")}</span></a><h3>${esc(f.t)}</h3>${f.m?`<span class="cap">${esc(f.m)}</span>`:""}${f.x?`<p>${esc(f.x)}</p>`:""}</div>`}
function tete(cap,titre,chapo,retour){return `<div class="page-tete">${retour?`<a class="lien retour" href="#${retour[0]}">← ${esc(retour[1])}</a><br>`:""}<span class="cap"><b>${esc(cap)}</b></span><h1>${esc(titre)}</h1>${chapo?`<p class="c">${rich(chapo)}</p>`:""}</div>`}
const carte=o=>`<a class="pj" href="#${o.id}">${o.hero?img(o.hero,o.t):""}<div class="l"><span class="cap">${esc(o.k)}</span><h3>${esc(o.t)}</h3></div></a>`;

/* ---------- accueil ---------- */
function accueil(){
  const H=D.heroSets[Math.floor(Math.random()*D.heroSets.length)];
  const aff=D.affiches.slice(0,24).map(p=>`<a href="#ed-affiches">${img(p,"Affiche")}</a>`).join("");
  const sp=D.edition.spinomag.slice(0,18).map(s=>`<a href="#" data-doc="${esc(s.k)}">${img(s.c,"Spinomag "+s.t)}</a>`).join("");
  const T=D.tuiles,R=D.rub;
  app.innerHTML=`
  <div class="hero">${H.map((p,i)=>`<img src="i/${p[0]}.webp" alt="" class="ok ${i?"":"on"}">`).join("")}
    <div class="txt"><h1>Emmanuel <em>Quéau</em></h1><div class="metiers">${D.accueil.metiers.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div></div>
  <div class="wrap intro">
    <p class="g">${esc(D.accueil.phrase).replace(/\*([^*]+)\*/g,"<em>$1</em>").replace(/\n/g,"<br>")}</p>
    <div class="trois">${D.accueil.trois.map(x=>`<div><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div>`).join("")}</div>
  </div>
  <section class="bloc wrap"><div class="tete"><h2>Focus</h2><a class="lien" href="#focus">Tous les dossiers</a></div><div class="projets">${D.focus.map(carte).join("")}</div></section>
  <section class="bloc"><div class="tete wrap"><h2>Affiches</h2><a class="lien" href="#ed-affiches">${D.affiches.length} affiches</a></div><div class="ruban">${aff}</div></section>
  <section class="bloc wrap"><div class="tete"><h2>Photographie</h2><a class="lien" href="#photo">Toutes les séries</a></div>
    <div class="tuiles">${["spectacles","visites","series"].map(k=>`<a class="tu" href="#${k}">${img(T[k],R[k].label)}<div class="l"><span class="cap">${esc(R[k].kicker)} · ${R[k].items.length}</span><h3>${esc(R[k].label)}</h3></div></a>`).join("")}</div></section>
  <section class="bloc"><div class="tete wrap"><h2>Édition</h2><a class="lien" href="#edition">Magazine, saison, guides</a></div><div class="ruban bas">${sp}</div></section>
  <section class="bloc wrap"><div class="tete"><h2>IA et automatisation</h2><a class="lien" href="#ia">Les outils</a></div><div class="fiches">${D.ia.map(o=>`<a class="fi" href="#${o.id}">${o.p.length?`<div class="im">${img(o.p[0],o.t)}</div>`:`<div class="im vide"></div>`}<div class="l"><h3>${esc(o.t)}</h3><span class="cap">${esc(o.k)}</span></div></a>`).join("")}</div></section>
  <section class="bloc wrap"><div class="tete"><h2>Vidéo</h2><a class="lien" href="#video">${D.films.length} films</a></div><div class="films">${D.films.slice(0,6).map((f,i)=>film(f,i+1)).join("")}</div></section>`;
  const im=[...app.querySelectorAll(".hero img")];let k=0;clearInterval(window._h);
  if(!matchMedia("(prefers-reduced-motion:reduce)").matches)window._h=setInterval(()=>{im[k].classList.remove("on");k=(k+1)%im.length;im[k].classList.add("on")},5200);
}

/* ---------- focus ---------- */
function focus(){
  app.innerHTML=tete("Dossiers","Focus","Les projets structurants de la ville, suivis sur plusieurs années, où la communication a porté un dossier de bout en bout.")+
  `<div class="wrap"><div class="projets">${D.focus.map(carte).join("")}</div></div>`;
}
const lien=l=>l[1][0]==="#"?`<a class="lien" href="${l[1]}">${esc(l[0])} →</a>`:`<a class="lien" href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])} ↗</a>`;
/* bas de page : precedent / suivant, detaches du contenu */
function suite(L,o,lien=x=>"#"+x.id,nom=x=>x.t){
  const i=L.indexOf(o),a=L[(i-1+L.length)%L.length],b=L[(i+1)%L.length];
  return `<div class="wrap suite"><a class="lien" href="${lien(a)}">← Précédent : ${esc(nom(a))}</a><a class="lien" href="${lien(b)}">Suivant : ${esc(nom(b))} →</a></div>`;
}
/* dossier raconte en chapitres : un temps de texte, un temps d'images */
function recit(p){
  const all=[],mob=innerWidth<700;
  let h=tete(p.k,p.t,p.c,["focus","Tous les dossiers"]);
  if(p.hero){all.push(p.hero);h+=`<a href="#" data-lb="0"><img class="plein-img ok" src="i/${p.hero[0]}.webp" width="${p.hero[1]}" height="${p.hero[2]}" alt="${esc(p.t)}"></a>`}
  h+=`<div class="wrap">`;
  if(p.chiffres.length)h+=`<div class="chiffres">${p.chiffres.map(c=>`<div><b>${esc(c[0])}</b><span>${esc(c[1])}</span></div>`).join("")}</div>`;
  h+=`<div class="somm" role="navigation" aria-label="Chapitres">${p.recit.filter(b=>b.n).map(b=>`<button type="button" data-go="ch-${b.n}"><b>${b.n}</b> ${esc(b.k)}</button>`).join("")}</div><div class="recit">`;
  p.recit.forEach(b=>{
    if(b.h){
      const corps=b.liste?`<ul>${b.liste.map(x=>`<li>${rich(x)}</li>`).join("")}</ul>`:b.x.map(para).join("");
      const liens=b.liens?`<p class="liens">${b.liens.map(lien).join("")}</p>`:"";
      h+=`<section class="sec chap"${b.n?` id="ch-${b.n}"`:""}><div class="num">${b.n?`<b>${b.n}</b>`:""}<span class="cap"><b>${esc(b.k)}</b>${b.d?" · "+esc(b.d):""}</span></div><div><h2>${rich(b.h)}</h2>${corps}${liens}</div></section>`;
    }else if(b.img){
      const s=all.length,n=b.img.length;b.img.forEach(x=>all.push(x));
      const cible=b.mur?0:mob?(b.pg&&b.img.some(q=>q[1]>q[2])?1:Math.min(2,n)):n;
      h+=`<figure class="phase${b.pg?" pg":""}">${rangs(b.img,s,cible,b.pg&&(mob||n<=2))}${b.leg?`<figcaption class="cap">${esc(b.leg)}</figcaption>`:""}</figure>`;
    }else if(b.liens_seuls){
      h+=`<p class="liens phase">${b.liens_seuls.map(lien).join("")}</p>`;
    }else if(b.films){
      h+=`<div class="films phase">${b.films.map((f,i)=>film({t:f[0],y:f[1],m:"",x:""},i+1)).join("")}</div>`;
    }
  });
  h+=`</div></div>`;
  h+=suite(D.focus,p);
  app.innerHTML=h;lier(all);vignettes();
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const c=document.getElementById(b.dataset.go);if(c)c.scrollIntoView({behavior:"smooth",block:"start"})});
}
function focusItem(p){
  if(p.recit)return recit(p);
  const gal=p.planche?[]:p.galerie; /* planche contact : vignettes sans visionneuse */
  const all=[...(p.hero?[p.hero]:[]),...gal,...p.plus.aff,...p.plus.couv];
  const g0=p.hero?1:0, a0=g0+gal.length, c0=a0+p.plus.aff.length;
  const sec=p.sections.map(([t,ps])=>{const liste=/produit|étapes|procédé/i.test(t)||ps.every(x=>x.startsWith("• "));
    return `<div class="sec"><h2>${esc(t)}</h2><div>${liste?`<ul>${ps.map(x=>`<li>${rich(x.replace(/^• /,""))}</li>`).join("")}</ul>`:ps.map(para).join("")}</div></div>`}).join("");
  let h=tete(p.k,p.t,p.c,["focus","Tous les dossiers"]);
  if(p.hero)h+=`<a href="#" data-lb="0"><img class="plein-img ok" src="i/${p.hero[0]}.webp" width="${p.hero[1]}" height="${p.hero[2]}" alt="${esc(p.t)}"></a>`;
  if(p.poeme)h+=`<div class="wrap"><blockquote class="poeme">${p.poeme.map(l=>`<span>${esc(l)}</span>`).join("")}</blockquote></div>`;
  const nb0=all.length, nd0=nb0+((p.bandeau||[]).length);
  const tete2 = p.bandeau&&p.bandeau.length
    ? `<div class="bandeau">${p.bandeau.map((x,i)=>`<a href="#" data-lb="${nb0+i}">${img(x,"Affiche")}</a>`).join("")}</div>`
      + ((p.diplomes&&p.diplomes.length)?`<div class="bandeau dip">${p.diplomes.map((x,i)=>`<a href="#" data-lb="${nd0+i}">${img(x,"Remise des prix")}</a>`).join("")}</div>`:"")
    : p.chiffres.length ? `<div class="chiffres">${p.chiffres.map(c=>`<div><b>${esc(c[0])}</b><span>${esc(c[1])}</span></div>`).join("")}</div>` : "";
  h+=`<div class="wrap">${tete2}<div class="sections">${sec}</div></div>`;
  if(p.id==="f-spinomag"){h+=`<div class="wrap" style="margin-top:50px"><div class="mur">${D.edition.spinomag.map(s=>`<div><a href="#" data-doc="${esc(s.k)}">${img(s.c,"Spinomag "+s.t)}</a><div class="leg"><b>${esc(s.t)}</b><span>${esc(s.d)}</span></div></div>`).join("")}</div><p class="note">Cliquez sur une couverture pour feuilleter le numéro.</p></div>`;app.innerHTML=h;return}
  if(p.galerie.length)h+=`<div class="wrap">${p.grille
    ? `<div class="grille" style="grid-template-columns:repeat(${p.grille},1fr)">${p.galerie.map((x,i)=>p.planche?`<div>${img(x,p.t)}</div>`:`<a href="#" data-lb="${g0+i}">${img(x,p.t)}</a>`).join("")}</div>`
    : rangs(p.galerie,g0)}</div>`;
  if(p.plus.aff.length)h+=`<div class="wrap bloc"><div class="tete"><h2 class="h2b">Affiches et panneaux</h2></div><div class="mur">${p.plus.aff.map((x,i)=>`<a href="#" data-lb="${a0+i}">${img(x,"Affiche")}</a>`).join("")}</div></div>`;
  if(p.plus.couv.length)h+=`<div class="wrap bloc"><div class="tete"><h2 class="h2b">Dans le Spinomag</h2></div><div class="mur">${p.plus.couv.map((x,i)=>`<a href="#" data-lb="${c0+i}">${img(x,"Couverture du Spinomag")}</a>`).join("")}</div></div>`;
  if(p.plus.films.length)h+=`<div class="wrap bloc"><div class="tete"><h2 class="h2b">En vidéo</h2></div><div class="films">${p.plus.films.map((f,i)=>film({t:f[0],y:f[1],m:"",x:""},i+1)).join("")}</div></div>`;
  h+=suite(D.focus,p);
  app.innerHTML=h;lier(all.concat(p.bandeau||[],p.diplomes||[]));
}

/* ---------- édition ---------- */
const EDT={lettres:["Lettres du maire","Lettres du maire","Budget, urbanisme, rénovation urbaine, installation du conseil municipal : des lettres d'information distribuées dans toutes les boîtes aux lettres. Rédaction, mise en page et suivi de fabrication. Cliquez sur une lettre pour la feuilleter."],infotravaux:["Infos travaux","Infos travaux","Un gabarit unique, reconnaissable dans la rue comme dans la boîte aux lettres : chaque chantier, coupure ou fermeture de voie est annoncé aux riverains par un avis d'une page, avec plan, dates et contact."],spinomag:["Spinomag","Le magazine de la Ville","Six numéros par an, 32 pages, 5 200 exemplaires : ligne éditoriale, rédaction, mise en page, photographie et suivi de fabrication. Cliquez sur une couverture pour feuilleter le numéro, page par page."],
 saison:["Saison culturelle","Brochures de la MAC","Chaque année, la brochure de saison donne le ton de la Maison des Arts et de la Culture : une illustration de couverture déclinée ensuite sur toutes les affiches de l'année."],
 guides:["Guides thématiques","Guides et livrets","Petite enfance, enfance et jeunesse, seniors, logement, nature, nouveaux arrivants, associations : les guides pratiques de la Ville, conçus, écrits et mis en page au service."],
 voeux:["Cartes de vœux","Vœux du maire","Les cartes de vœux de la Ville, une par année."],
 affiches:["Affiches","Affiches et panneaux","Spectacles, expositions, fêtes de la ville, commémorations, seniors, jeunesse, travaux, grands projets : les affiches, panneaux et couvertures conçus pour la Ville d'Épinay-sous-Sénart depuis 2019, des plus récents aux plus anciens."]};
function edition(k){
  k=k||"affiches";const E=D.edition,[cap,titre,lede]=EDT[k];
  let corps="";
  if(k==="infotravaux"){corps=`<div class="mur">${E.infotravaux.map((p,i)=>`<a href="#" data-lb="${i}">${img(p,"Infos travaux")}</a>`).join("")}</div>`}
  else if(k==="affiches"){corps=`<div class="mur">${D.affiches.map((p,i)=>`<a href="#" data-lb="${i}">${img(p,"Affiche")}</a>`).join("")}</div>`}
  else if(k==="voeux"){corps=rangs(E.voeux,0)}
  else{corps=`<div class="mur">${E[k].map(s=>`<div><a href="#" data-doc="${esc(s.k)}">${img(s.c,s.t)}</a><div class="leg"><b>${esc(s.t)}</b><span>${esc(s.d)}${s.d?" · ":""}${s.n} page${s.n>1?"s":""}</span></div></div>`).join("")}</div>`}
  app.innerHTML=tete(cap,titre,lede)+
   `<div class="wrap"><div class="onglets">${E.onglets.map(o=>`<a href="#ed-${o[0]}" class="${o[0]===k?"on":""}">${esc(o[1])}</a>`).join("")}</div>
    ${k==="spinomag"?`<p class="note" style="margin:-10px 0 24px"><a class="lien" href="https://www.calameo.com/accounts/7710912" target="_blank" rel="noopener">Feuilleter sur Calaméo</a></p>`:""}
    ${corps}</div>`+suite(E.onglets,E.onglets.find(o=>o[0]===k),x=>"#ed-"+x[0],x=>x[1]);
  if(k==="affiches")lier(D.affiches); else if(k==="infotravaux")lier(E.infotravaux); else if(k==="voeux")lier(E.voeux);
}
/* ---------- photo ---------- */
function photo(k){
  k=k||"spectacles";const R=D.rub[k];
  app.innerHTML=tete("Photographie",R.label,R.lede)+`<div class="wrap"><div class="onglets">${["spectacles","visites","series"].map(x=>`<a href="#${x}" class="${x===k?"on":""}">${esc(D.rub[x].label)}</a>`).join("")}</div>
  <div class="fiches">${R.items.map(o=>`<a class="fi" href="#${o.id}"><div class="im">${img(o.p[0],o.t)}</div><div class="l"><h3>${esc(o.t)}</h3><span class="cap">${esc(o.d)}</span></div></a>`).join("")}</div></div>`;
}
const LIE={"v-anru":["f-renovation","Le dossier : rénovation urbaine de La Plaine"],"v-suivi-des-travaux-cdc-habitat":["f-renovation","Le dossier : rénovation urbaine de La Plaine"],"v-territoire-zero-chomeur":["f-tzcld","Le dossier : Territoire zéro chômeur de longue durée"],"v-stephane-viry":["f-tzcld","Le dossier : Territoire zéro chômeur de longue durée"],"v-fabienne-balussou":["f-geothermie","Le dossier : la géothermie"],"v-inauguration-de-la-mac":["f-mac","Le dossier : la Maison des Arts et de la Culture"]};
function fiche(o,k){
  const R=D.rub[k], reste=o.p.slice(1);
  let h=tete(R.kicker+(o.d?" · "+o.d:""),o.t,o.x[0]||"",[k,R.label]);
  h+=`<a href="#" data-lb="0"><img class="plein-img ok" src="i/${o.p[0][0]}.webp" width="${o.p[0][1]}" height="${o.p[0][2]}" alt="${esc(o.t)}"></a>`;
  if(k==="visites"){
    /* reperes (date, personnalites), puis un temps de texte, un temps d'images */
    const qui=o.w&&o.w.toLowerCase()!==o.t.toLowerCase()?o.w.split(/\s*;\s*/).filter(Boolean):[];
    const T=o.x.slice(1), n=Math.max(1,T.length), par=Math.ceil(reste.length/n);
    h+=`<div class="wrap" style="margin-top:40px">`;
    if(o.d||qui.length)h+=`<div class="reperes">${o.d?`<span class="cap"><b>${esc(o.d)}</b></span>`:""}${qui.map(q=>`<span>${esc(q)}</span>`).join("")}</div>`;
    h+=`<div class="visite">`;
    for(let i=0;i<n;i++){
      if(T[i])h+=`<div class="col">${para(T[i])}</div>`;
      const g=reste.slice(i*par,i===n-1?reste.length:(i+1)*par);
      if(g.length)h+=`<div class="phase">${rangs(g,1+i*par,innerWidth<700?Math.min(2,g.length):g.length)}</div>`;
    }
    h+=`</div>${LIE[o.id]?`<p class="liens phase" style="margin-top:34px">${lien(["#"+LIE[o.id][0],LIE[o.id][1]].reverse())}</p>`:""}</div>`;
  }else{
    h+=`<div class="wrap" style="margin-top:40px">${o.w&&o.w.toLowerCase()!==o.t.toLowerCase()?`<p class="cap" style="margin-bottom:18px">${esc(o.w)}</p>`:""}<div class="col">${o.x.slice(1).map(para).join("")}</div>${rangs(reste,1,reste.length<=4?2:0)}</div>`;
  }
  h+=suite(R.items,o);
  app.innerHTML=h;lier(o.p);
}

/* ---------- IA ---------- */
function ia(){
  app.innerHTML=tete("Innovation","IA et automatisation","Des outils conçus pour un service d'une seule personne : une base de connaissances qui vérifie, des générateurs qui produisent, des scénarios qui publient, des archives qui s'animent. Certains servent chaque jour ; d'autres sont des expérimentations et des tests.")+
  `<div class="wrap"><div class="fiches">${D.ia.map(o=>`<a class="fi" href="#${o.id}">${o.p.length?`<div class="im">${img(o.p[0],o.t)}</div>`:`<div class="im vide"></div>`}<div class="l"><h3>${esc(o.t)}</h3><span class="cap">${esc(o.k)}${o.d?" · "+esc(o.d):""}</span></div></a>`).join("")}</div></div>`;
}
function iaItem(o){
  let h=tete("IA et automatisation"+(o.d?" · "+o.d:""),o.t,o.x[0]||"",["ia","Tous les outils"]);
  if(o.p.length)h+=`<a href="#" data-lb="0"><img class="plein-img ok" src="i/${o.p[0][0]}.webp" width="${o.p[0][1]}" height="${o.p[0][2]}" alt="${esc(o.t)}"></a>`;
  h+=`<div class="wrap" style="margin-top:40px"><div class="col">${o.x.slice(1).map(para).join("")}</div>`;
  if(o.liens.length)h+=`<p style="margin-top:26px;display:flex;gap:26px;flex-wrap:wrap">${o.liens.map(l=>`<a class="lien" href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])} ↗</a>`).join("")}</p>`;
  if(o.blocs){let n=1;h+=`<div class="recit" style="margin-top:clamp(34px,5vw,64px)">`+o.blocs.map(b=>{const st=n;n+=b.n;return (b.h?`<h2 class="h2b" style="margin-top:20px">${esc(b.h)}</h2>`:"")+`<figure class="phase">${rangs(o.p.slice(st,st+b.n),st,innerWidth<700&&!b.duo?Math.min(2,b.n):b.par||b.n)}${b.leg?`<figcaption class="cap">${esc(b.leg)}</figcaption>`:""}</figure>`}).join("")+`</div>`}
  else if(o.p.length>1)h+=rangs(o.p.slice(1),1,2);
  h+=`</div>`;
  if(o.films.length)h+=`<div class="wrap bloc"><div class="tete"><h2 class="h2b">En vidéo</h2></div><div class="films">${o.films.map((f,i)=>film({t:f[0],y:f[1],m:"",x:""},i+1)).join("")}</div></div>`;
  h+=suite(D.ia,o);
  app.innerHTML=h;lier(o.p);
}
function video(){
  app.innerHTML=tete("Vidéo","Films pour la Ville","Écriture, tournage, prise de vue aérienne et montage : reportages, captations, films de vœux, rétrospectives, 2018-2026.")+
  `<div class="wrap"><p class="note">Chaque vignette ouvre le film sur YouTube.</p><div class="films" style="margin-top:22px">${D.films.map((f,i)=>film(f,i+1)).join("")}</div></div>`;
}
function archives(){
  app.innerHTML=tete("Archives · 2006-2017","Collectif TROTAR","Douze ans de réalisation et de direction de création à Paris : courts métrages, publicités, clips, génériques, installations interactives.")+
  `<div class="wrap"><p class="cap" style="margin-bottom:26px">Références : Ministère de la Culture, SNCF, Fondation Abbé Pierre, ASUS, Jaguar, Free, Patrice, Olivia Ruiz, « Scènes de ménages »</p><div class="films">${D.archives.map((f,i)=>film({t:f.t,y:f.y,m:"",x:f.x},i+1)).join("")}</div></div>`;
}
function apropos(){
  const A=D.apropos,ex=e=>`<div class="exp"><span class="cap"><b>${esc(e.d)}</b></span><b>${esc(e.t)}</b>${e.p?`<p>${esc(e.p)}</p>`:""}${e.li&&e.li.length?`<ul>${e.li.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}${e.note?`<p style="margin-top:8px">${esc(e.note)}</p>`:""}</div>`;
  app.innerHTML=tete("À propos","Emmanuel Quéau",A.chapo)+
  `<div class="wrap apropos"><div>
    <h2>Expérience</h2>${A.exp.map(ex).join("")}
    <h2>Formation</h2>${A.formation.map(ex).join("")}
  </div><div>
    <h2>Contact</h2>
    <div class="contact"><a href="mailto:queau.emm@gmail.com">queau.emm@gmail.com</a><a href="tel:+33625757022">06 25 75 70 22</a><a href="https://www.flickr.com/photos/queau" target="_blank" rel="noopener">flickr.com/photos/queau</a></div>
    <h2>Compétences</h2>
    <div class="puces">${A.competences.map(x=>`<span>${esc(x)}</span>`).join("")}</div>
    <h2>Et aussi</h2>
    <div class="puces">${A.aussi.map(x=>`<span>${esc(x)}</span>`).join("")}</div>
  </div></div>`;
}


/* ---------- routeur ---------- */
const IDX={};for(const k in D.rub)D.rub[k].items.forEach(o=>IDX[o.id]=[o,k]);
const FX={};D.focus.forEach(p=>FX[p.id]=p);
const IAX={};D.ia.forEach(o=>IAX[o.id]=o);
function route(){
  const h=(location.hash||"#accueil").slice(1);clearInterval(window._h);
  let sec=h;
  if(FX[h]){focusItem(FX[h]);sec="focus"}
  else if(IAX[h]){iaItem(IAX[h]);sec="ia"}
  else if(IDX[h]){fiche(...IDX[h]);sec="photo"}
  else if(h==="focus"||h==="projets"){focus();sec="focus"}
  else if(h==="edition"){edition("spinomag")}
  else if(h.startsWith("ed-")){edition(h.slice(3));sec="edition"}
  else if(h==="affiches"){edition("affiches");sec="edition"}
  else if(h==="photo"){photo("spectacles")}
  else if(D.rub[h]){photo(h);sec="photo"}
  else if(h==="ia"){ia()}
  else if(h==="video"){video()}
  else if(h==="archives"){archives()}
  else if(h==="a-propos"){apropos()}
  else{accueil();sec="accueil"}
  $("#menu").innerHTML=MENU.map(m=>`<a href="#${m[0]}" class="${m[0]===sec?"on":""}">${m[1]}</a>`).join("");
  $("#menu").classList.remove("ouvert");$("#burger").setAttribute("aria-expanded","false");$("#lb").classList.remove("on");fermerFilm&&$("#vb").classList.remove("on");$("#vb .cadre").innerHTML="";
  scrollTo(0,0);hydrate();
}
$("#burger").onclick=()=>{const o=$("#menu").classList.toggle("ouvert");$("#burger").setAttribute("aria-expanded",o);$("#burger").textContent=o?"Fermer":"Menu"};
addEventListener("hashchange",route);
addEventListener("scroll",()=>$("#hd").classList.toggle("plein",scrollY>60),{passive:true});
let rz;addEventListener("resize",()=>{clearTimeout(rz);const w=innerWidth;rz=setTimeout(()=>{
  if((w<700)!==(window._w<700)){ouvert()?aRouter=true:route()}
  window._w=w},200)});window._w=innerWidth;
route();
</script>
