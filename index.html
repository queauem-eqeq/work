,"d":"Captations","h":"Des concerts et des films","x":["Captations de concerts, série « Carte Blanche », rétrospectives : la vidéo prolonge la saison au-delà de la salle."]},{"films":[["Vitaa à la MAC","CiCY-BR5BLk"],["Speakeasy","OfgOvqJY9TY"],["Carte Blanche #2 : FIVE and SO","p2HgyJlAqhY"]]},{"n":"","k":"Bilan","h":"Ce que j'ai produit","liste":["Les brochures de saison et leurs couvertures, de 2021/2022 à 2026/2027.","Les affiches des spectacles, des expositions, du festival « Dans ma tête » et de la Micro-Folie.","La photographie de scène : concerts, théâtre, danse, cirque, résidences.","Des captations et des films : concerts, série « Carte Blanche », rétrospectives."]}]},{"id":"f-geothermie","t":"La géothermie, 40 ans sous la ville","k":"Énergie · 1984-2026","c":"Une centrale géothermique installée en 1984 chauffe les trois quarts de la ville. Rendre visible, et compréhensible, une énergie qui circule sous les pieds des habitants.","hero":[720,1400,933],"chiffres":[["1984","mise en service de la centrale, au parc de l'Europe"],["1 850 m","profondeur du forage, dans la nappe du Dogger"],["72 °C","température de l'eau puisée"],["~ 7 000","équivalents-logements raccordés au réseau"]],"sections":[["Le réseau",["Le réseau de chaleur d'Épinay-sous-Sénart est alimenté par la centrale géothermique du parc de l'Europe, en service depuis 1984 et exploitée par la SEMGEP, société d'économie mixte dont la Ville est actionnaire majoritaire.","Le principe tient en deux puits : l'un remonte une eau à 72 °C puisée à 1 850 mètres dans la nappe du Dogger, avec un débit qui atteint 280 m³/h en hiver ; l'autre réinjecte l'eau refroidie. Des chaufferies d'appoint au gaz prennent le relais lors des pointes, la géothermie couvrant les trois quarts des besoins.","Le réseau dessert près de 7 000 équivalents-logements : trois bailleurs sociaux, la quasi-totalité des copropriétés, la plupart des équipements publics et, depuis peu, la résidence Talma. Plus de 150 000 tonnes de CO₂ ont été évitées depuis la création."]],["Expliquer une énergie invisible",["Une centrale géothermique ne se voit pas : pas de cheminée, pas de panneaux, un bâtiment bas dans un parc. Tout l'enjeu de communication est là — montrer ce qui est enfoui, nommer ce qui chauffe les radiateurs, et le faire sans jargon.","Les 40 ans du réseau, en 2025, ont donné l'occasion d'une exposition, « 40 ans de la géothermie », accompagnée des photographies « Dessus-Dessous » de Lionel Antoni. La visite de la préfète de l'Essonne, le 30 juin 2026, et le changement de la pompe de production, le 14 septembre 2026, ont été l'occasion d'y revenir en images."]],["Ce que j'ai produit",["Le reportage photographique dans la centrale et dans les galeries techniques : machines, têtes de puits, échangeurs, interventions.","Les dossiers du Spinomag consacrés au réseau, du fonctionnement de la centrale (n°148) au bilan 2026 et aux perspectives d'extension (n°177, p. 26).","La couverture des temps forts : visite préfectorale, exposition des 40 ans, travaux sur le réseau."]]],"galerie":[[720,1400,933],[721,1400,933],[722,1400,933],[723,1400,933],[724,1400,933],[725,1400,933],[726,1400,933],[727,1400,933]],"plus":{"aff":[],"couv":[[377,999,1300]],"films":[]},"recit":[{"n":"01","k":"Comprendre","d":"Le réseau","h":"Une énergie qui circule sous les pieds","x":["Le réseau de chaleur d'Épinay-sous-Sénart est alimenté par la centrale géothermique du parc de l'Europe, en service depuis 1984 et exploitée par la SEMGEP, société d'économie mixte dont la Ville est actionnaire majoritaire.","Le principe tient en deux puits : l'un remonte une eau à 72 °C puisée à 1 850 mètres dans la nappe du Dogger, avec un débit qui atteint 280 m³/h en hiver ; l'autre réinjecte l'eau refroidie. Des chaufferies d'appoint au gaz prennent le relais lors des pointes, la géothermie couvrant les trois quarts des besoins.","Une centrale géothermique ne se voit pas : pas de cheminée, pas de panneaux, un bâtiment bas dans un parc. Tout l'enjeu de communication est là — montrer ce qui est enfoui, nommer ce qui chauffe les radiateurs, et le faire sans jargon."]},{"pg":1,"img":[[1746,1229,1600,"Spinomag n°148 (février 2021) et n°177 (novembre-décembre 2026) : expliquer le fonctionnement, puis dresser le bilan"],[2569,1229,1600,"Spinomag n°148 (février 2021) et n°177 (novembre-décembre 2026) : expliquer le fonctionnement, puis dresser le bilan"]],"leg":"Spinomag n°148 (février 2021) et n°177 (novembre-décembre 2026) : expliquer le fonctionnement, puis dresser le bilan."},{"n":"02","k":"Montrer","d":"La centrale","h":"Entrer dans la centrale","x":["Le réseau dessert près de 7 000 équivalents-logements : trois bailleurs sociaux, la quasi-totalité des copropriétés, la plupart des équipements publics et, depuis peu, la résidence Talma. Plus de 150 000 tonnes de CO₂ ont été évitées depuis la création."]},{"img":[[2605,1600,1067,"Dans la centrale géothermique du parc de l'Europe"],[2606,1600,1067,"Dans la centrale géothermique du parc de l'Europe"],[727,1400,933,"Dans la centrale géothermique du parc de l'Europe"]],"leg":"Dans la centrale géothermique du parc de l'Europe."},{"n":"03","k":"Suivre","d":"Hiver 2021","h":"Quand le chantier rend l'énergie visible","x":["À l'hiver 2021, une machine de forage s'installe dans le parc de l'Europe pour l'entretien des puits. Pendant quelques semaines, ce qui se passe à 1 850 mètres sous terre devient un chantier que chacun peut voir, et que le Spinomag explique."]},{"img":[[720,1920,1280,"Hiver 2021 : le chantier d'entretien des puits, parc de l'Europe"],[722,1400,933,"Hiver 2021 : le chantier d'entretien des puits, parc de l'Europe"],[725,1920,1280,"Hiver 2021 : le chantier d'entretien des puits, parc de l'Europe"]],"leg":"Hiver 2021 : le chantier d'entretien des puits, parc de l'Europe."},{"img":[[723,1920,1280,"Sur la plateforme et dans la cabine de contrôle"],[2607,1600,1067,"Sur la plateforme et dans la cabine de contrôle"],[724,1400,933,"Sur la plateforme et dans la intemps des poètes est national ; à Épinay-sous-Sénart, il prend la forme d'un affichage de poèmes dans les rues, devant les écoles, à la médiathèque, au centre socioculturel et à la Maison des Arts et de la Culture, doublé d'un concours de poésie.","Le concours est ouvert à tous, avec une catégorie scolaire, « L'École des poètes ». Les élus du Conseil municipal des enfants et du Conseil municipal des jeunes siègent au jury ; en 2025, pour la 5e édition, il était présidé par l'écrivain spinolien Yannick Laristan.","Les thèmes suivent l'édition nationale : « La Grâce » en 2024, « La liberté, force vive, déployée » en 2026, « La Poésie : Zones d'actions » annoncé pour 2027."]],["Photographier des mots",["Un poème collé sur un mur n'est pas un sujet facile : c'est du texte, plat, souvent mal éclairé. La série cherche donc autre chose — les mots pris dans la ville, les passants qui s'arrêtent, les enfants qui lisent à voix haute, la remise des prix, les mains et les visages autour des textes.","C'est la série la plus longue du portfolio, et celle qui dit le mieux ce que fait la photographie en communication municipale : transformer un dispositif administratif en moment partagé."]],["Ce que j'ai produit",["**Les visuels des poèmes** : chaque texte retenu devient une affiche. Composition typographique, choix de l'image ou du fond, mise au format d'affichage urbain, préparation des fichiers d'impression — une série complète à produire chaque année, en quelques jours, entre la clôture du concours et la pose dans les rues.","**L'affiche de la manifestation** et les supports d'appel à textes, déclinés sur le site, l'application et les réseaux sociaux.","**La couverture photographique** des éditions successives : affichage, lectures, ateliers, remises de prix.","**Les pages du Spinomag** consacrées à chaque édition."]]],"galerie":[[760,1400,933],[761,3840,2560],[762,3840,2560],[763,3840,2560],[764,3840,2560],[765,3840,2560],[766,3840,2560],[767,3840,2560],[768,3840,2560],[769, 0,1400],[1153,990,1400],[1154,990,1400],[1155,990,1400],[1156,987,1400],[1157,990,1400],[1158,987,1400]]},"ia":[{"id":"ia-cerveau","t":"Le cerveau numérique de la Ville","k":"Base de connaissances","d":"Depuis 2025","x":["Un cerveau numérique pour la Ville d'Épinay","Pour le service communication d'Épinay-sous-Sénart, j'ai organisé une infrastructure de connaissances structurée sur le modèle du RAG (Retrieval-Augmented Generation, ou génération augmentée par la recherche). À chaque demande, l'assistant IA consulte d'abord les fichiers adaptés dans cette base, puis répond avec une connaissance précise du contexte, des services municipaux, de l'histoire de la ville et des réalisations passées.","L'assistant n'est que l'interface. Le cœur du système, c'est la base de connaissances organisée, qui permet de croiser et de recouper les informations.","• Base de connaissances : six ans de magazines, guides, pages du site, publications Facebook, conseils municipaux et décisions du maire, organisés en une trentaine de fiches thématiques. Chaque fiche distingue la situation actuelle de l'historique.","• Index et hiérarchie des sources : un fichier d'entrée indique quelle fiche fait foi pour chaque type d'information (lieux, élus, démarches, points incertains).","• Mémoire : les dossiers en cours et les décisions déjà prises sont conservés d'une session à l'autre.","• Référentiel rédactionnel : un document unique fixe le ton, les graphies et les formats de chaque support.","• Procédures (skills) : les tâches répétées suivent des étapes définies, qui renvoient aux bonnes fiches.","• Croisement et contrôle : chaque fait est vérifié à sa source de référence. Un registre recense les points incertains et une copie miroir sur disque assure la sauvegarde. Les nouveaux faits sont ajoutés au corpus dès leur validation.","Le graphe montre cette architecture : les fichiers, les liens qui les relient et le trajet d'une demande jusqu'à sa publication.","Un service de communication d'une seule personne ne peut pas tout retenir : six ans de magazines, des guides, des délibérations, un site, des milliers de publications. J'ai donc construit une base de connaissances consolidée — une trentaine de fiches thématiques qui font référence, chacune sourcée numéro par numéro.","Chaque fait y est rattaché à sa source (« Spinomag n°177, p. 26 », « délibération du 23/06/2026 », « page Facebook du 31/03/2026 »), et les points incertains sont listés à part plutôt que lissés. L'outil ne remplace pas la vérification : il la rend possible en quelques secondes au lieu d'une demi-journée d'archives.","Un référentiel rédactionnel unique — ton, graphies, formats de date, règles de citation des élus, neutralité en période électorale — s'applique à toute production, humaine ou assistée.","Le graphe ci-dessus donne à voir l'architecture : prompt système, fiches de base, chaînes de raisonnement, compétences, connecteurs, mémoire, disque, sorties."],"p":[[1164,1200,750]],"liens":[["Explorer le graphe","https://queauem-eqeq.github.io/graphe-work/"]],"films":[]},{"id":"ia-spinogenerator","t":"SPINOGÉNÉRATOR","k":"Outil interne","d":"v.21","x":["Une page HTML autonome qui produit, à partir d'une seule image et de quelques champs, toutes les déclinaisons d'un visuel municipal : carré pour Instagram, 1080×1350 pour Facebook, A4 à 300 dpi pour l'impression — logo, titre, date, heure, lieu, contact, aux couleurs et aux typographies de la charte.","Le point d'intérêt se place d'un clic et se propage à tous les formats ; chaque déclinaison se télécharge seule ou en archive. Trois autres onglets complètent l'outil : un générateur de textes, un module pour les visuels de la Maison des Arts et de la Culture, et un générateur de cartes de visite.","L'enjeu n'est pas la prouesse technique mais le temps : ce qui demandait une demi-heure de montage par événement prend maintenant deux minutes, et le résultat est conforme à la charte par construction."],"p":[[1166,2016,1260],[1167,2016,1260]],"liens":[["Essayer l'outil","https://queauem-eqeq.github.io/spinogenerator/"]],"films":[]},{"id":"ia-site","t":"La fabrication de ce site","k":"Méthode","d":"2026","x":["Ce portfolio n'a pas été écrit à la main, et pas davantage généré d'un bloc. Il a été construit par itérations, en branchant un modèle de langage sur mes propres sources : les archives photo, les PDF des publications, les textes du service et la base de connaissances de la Ville.","### Un dossier source, un seul","Tout part d'un dossier rangé comme le menu du site : un sous-dossier par page, les textes dans des fichiers lisibles, les images numérotées dans l'ordre d'affichage. Pour changer un texte, j'écris dans le fichier ; pour changer une image, je la remplace ou je la renumérote. Le site est ensuite reconstruit à partir de ce dossier, jamais retouché à la main.","### Des images fabriquées, pas déposées","Chaque photo est produite en deux tailles  une vignette et une vue plein écran  au format WebP. Chaque magazine  guide ou brochure est converti depuis son PDF en images de pages  pour être feuilleté dans la visionneuse : 50 documents et 1 345 pages  sur 2 455 images en ligne. Les originaux  eux  ne quittent pas mes archives : le site ne contient que ce qu'il affiche.","### Une seule page, sans dépendance","Le site tient dans un fichier HTML : les textes, les données et le code d'affichage, sans bibliothèque ni base de données. La navigation, la visionneuse et le lecteur vidéo sont écrits pour lui. Il est hébergé sur GitHub Pages et tenu hors des moteurs de recherche.","### Des dossiers racontés","Les dossiers Focus sont décrits comme une suite de chapitres : un temps de texte, un temps d'images, une légende. Ce récit est une simple liste, que le site met en page. Pour les nourrir, le modèle a croisé les numéros du magazine, le site de la Ville et mes séries photo, retrouvées par leur nom de fichier dans les archives.","### Vérifier avant de publier","Le texte reste vérifié : aucun chiffre, aucune date, aucun nom n'est écrit sans source, et ce qui est incertain est signalé pour relecture. C'est la même règle que pour le magazine. Avant chaque mise en ligne, les pages sont affichées et contrôlées automatiquement, en version ordinateur et en version mobile.","CE QUE CELA CHANGE","• Une refonte complète menée par une seule personne, en quelques jours, sans prestataire.","• Un site qui se met à jour en déposant un fichier dans un dossier.","• Une méthode réutilisable pour un site de service, un rapport d'activité ou une exposition en ligne."],"p":[[2637,1600,1000],[2638,1600,1000],[1165,2016,1260]],"liens":[["Le graphe de la méthode","https://queauem-eqeq.github.io/graphe-work/"]],"films":[]},{"id":"ia-archives","t":"Épinay-sous-Sénart au fil des années","k":"Archives × IA","d":"2026","x":["Les archives municipales conservent des photographies de la ville prises depuis des décennies : rues, chantiers, fêtes, visages. Le film les remet en mouvement — animation des photographies fixes, continuité d'une époque à l'autre, pour montrer en quelques minutes ce qu'un siècle a fait du territoire.","L'IA sert ici d'outil de restauration et d'animation, pas de fabrication : les images sont authentiques, issues du fonds de la Ville."],"p":[],"liens":[],"films":[["Épinay-sous-Sénart au fil des années","5nk-hPA46ps"]]},{"id":"ia-tldr","t":"TLDR France","k":"Média expérimental","d":"Depuis 2026","x":["TLDR France, un média d'actualité 100 % IA","Conçu comme une expérimentation, TLDR France (« Too Long; Didn't Read » : trop long, pas lu) est un faux média d'actualité 100 % autonome. Chaque soir, il choisit un sujet, rédige les textes, crée une illustration et publie sur Instagram, Facebook et X, sans aucune intervention humaine. Le tout repose sur des infrastructures, des modèles de langage (LLM) et des outils de génération d'images gratuits.","Un laboratoire plus qu'une rédaction. La ligne éditoriale n'est pas figée : TLDR France sert avant tout de banc d'essai pour tester des prompts, comparer des modèles d'IA et observer leur comportement en conditions réelles, publication après publication.","Make, un automate en chef d'orchestre. Make agrège plusieurs services indépendants (moteur de recherche, base de données, modèles de langage, générateur d'images, outil de publication, messagerie), reliés entre eux par API. Chaque échange est codifié : formats de données, règles et filtres déterminent ce qui circule d'un service à l'autre. Aux moments de décision, ce sont des agents IA qui arbitrent : choix du sujet, croisement des sources, écriture, mise en image.","LE PROCÉDÉ, ÉTAPE PAR ÉTAPE","• Veille : chaque soir à 23 h, l'API Serper interroge Google Actualités sur les dernières 24 heures.","• Mémoire anti-doublon : une base de données Make conserve les 30 derniers sujets publiés. Un sujet déjà traité ne peut pas revenir pendant quatre jours.","• Choix du sujet : Gemini analyse les résultats, retient le sujet le plus important pour le public français et en tire un résumé factuel.","• Vérification : le scénario récupère l'article d'origine et lance une recherche complémentaire sur la semaine, pour croiser les sources.","• Rédaction : Gemini écrit un titre, un texte pour Instagram et Facebook et une version courte pour X, selon les consignes du prompt en cours de test, sans inventer aucun fait.","• Illustration : un prompt d'image est rédigé puis envoyé à Pollinations, qui produit le visuel au format carré.","• Publication : Buffer diffuse aussitôt le post sur X, Instagram et Facebook.","• Contrôle : un récapitulatif (textes, prompt, image) m'arrive par e-mail et le sujet rejoint la mémoire."],"p":[[1160,400,400],[1161,590,701],[1162,670,904],[1163,586,649]],"liens":[],"films":[]},{"id":"ia-make","t":"Veille et scénarios automatisés","k":"Automatisation","d":"Depuis 2025","x":["Une série de scénarios Make assure ce qu'un service d'une personne ne peut pas tenir à la main : veille d'actualité sur les sujets de la ville, collecte et mise en forme, préparation des publications.","Deux autres chaînes ont été construites : la relance automatique des événements sur les réseaux sociaux, et la publication automatique de l'agenda sur le site de la Ville à partir d'un agenda numérique partagé avec les services.","Ces systèmes ont été construits à titre de recherche et de test ; ils n'ont pas encore été déployés.","Le principe est toujours le même — automatiser la collecte et la mise en forme, garder la décision éditoriale et la relecture du côté humain."],"p":[],"liens":[],"films":[]}],"films":[{"t":"Qui étaient les sœurs Mirabal ?","m":"Sensibilisation","x":"Le 25 novembre 1960, Patria, Minerva et María Teresa Mirabal, militantes engagées contre la dictature, sont assassinées sur ordre du dictateur Rafael Trujillo, en République dominicaine. Devenues un symbole de la lutte contre les violences faites aux femmes, elles sont à l'origine de la Journée internationale pour l'élimination de la violence à l'égard des femmes, instituée par l'ONU en 1999.","y":"eIoZYm9kJr0"},{"t":"Réaménagement des bords de l'Yerres","m":"Reportage","x":"Abattage des peupliers vieillissants et reboisement en essences locales : une vaste opération pour redonner vie aux berges de l'Yerres.","y":"mUHKSPAWDOc"},{"t":"Épinay-sous-Sénart au fil des années","m":"Archives × IA","x":"Les images d'archives de la ville, animées grâce à l'intelligence artificielle.","y":"5nk-hPA46ps"},{"t":"Stade Alain Mimoun","m":"Travaux · 2025","x":"La rénovation du terrain de football synthétique, réalisée en 2025.","y":"L23Ie2hFCFo"},{"t":"Les Fabulettes, le making of","m":"Making of · 2025","x":"56 élèves des écoles spinoliennes reprennent les Fabulettes d'Anne Sylvestre avec le Hall de la Chanson.","y":"9Jsc4Xie2Tc"},{"t":"La Brénadienne","m":"Concert · 2026","x":"« An American Road Trip », samedi 9 mai 2026.","y":"GnSDGsQPyYU"},{"t":"La Nuit des arts martiaux","m":"Sport","x":"La Nuit des arts martiaux à Épinay-sous-Sénart.","y":"b8U7U88j1xU"},{"t":"Le service $("#lb .x").onclick=fermerLB;
$("#lb .p").onclick=()=>ouvrir(LBi-1);$("#lb .s").onclick=()=>ouvrir(LBi+1);
$("#lb").onclick=e=>{if(e.target.id==="lb")fermerLB()};
addEventListener("keydown",e=>{
  if($("#vb").classList.contains("on")){if(e.key==="Escape")fermerFilm();return}
  if(!$("#lb").classList.contains("on"))return;
  if(e.key==="Escape")fermerLB();if(e.key==="ArrowLeft")ouvrir(LBi-1);if(e.key==="ArrowRight")ouvrir(LBi+1)});
let tx=0;$("#lb").addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
$("#lb").addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)ouvrir(LBi+(d<0?1:-1))});

const yt=id=>id.startsWith("v:")?`https://vimeo.com/${id.slice(2)}`:`https://www.youtube.com/watch?v=${id}`;
const vig=id=>`data-y="${id}"`+(D.thumbs[id]?` style="background-image:url(${D.thumbs[id]})"`:"");
function vignettes(){document.querySelectorAll(".v[data-y]").forEach(a=>{const u=D.thumbs[a.dataset.y];if(u)a.style.backgroundImage=`url(${u})`})}
fetch("t.json").then(r=>r.json()).then(j=>{D.thumbs=j;vignettes()}).catch(()=>{});
function ouvrirDoc(key){const d=D.docs[key];if(!d)return;LB=d.p;LBtitre=d.t;ouvrir(0)}
addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[data-doc]");
  if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;e.preventDefault();ouvrirDoc(a.dataset.doc)});
function lireFilm(id,titre){
  if(id.startsWith("v:")){open(yt(id),"_blank","noopener");return}
  $("#vb .cadre").innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1" title="${esc(titre||"Film")}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  $("#vb .t").textContent=titre||"";$("#vb").classList.add("on");
}
function fermerFilm(){$("#vb").classList.remove("on");$("#vb .cadre").innerHTML="";$("#vb .t").textContent="";apresFermeture()}
$("#vb .x").onclick=fermerFilm;
$("#vb").onclick=e=>{if(e.target.id==="vb")fermerFilm()};
addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a.v[data-film]");
  if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;e.preventDefault();lireFilm(a.dataset.film,a.dataset.titre)});
function film(f,n){return `<div class="film"><a class="v" href="${yt(f.y)}" target="_blank" rel="noopener" data-film="${esc(f.y)}" data-titre="${esc(f.t)}" ${vig(f.y)} aria-label="Voir « ${esc(f.t)} »"><span class="n">${String(n).padStart(2,"0")}</span></a><h3>${esc(f.t)}</h3>${f.m?`<span class="cap">${esc(f.m)}</span>`:""}${f.x?`<p>${esc(f.x)}</p>`:""}</div>`}
function tete(cap,titre,chapo,retour){return `<div class="page-tete">${retour?`<a class="lien retour" href="#${retour[0]}">← ${esc(retour[1])}</a><br>`:""}<span class="cap"><b>${esc(cap)}</b></span><h1>${esc(titre)}</h1>${chapo?`<p class="c">${rich(chapo)}</p>`:""}</div>`}

const lien=l=>l[1][0]==="#"?`<a class="lien" href="${l[1]}">${esc(l[0])} →</a>`:`<a class="lien" href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])} ↗</a>`;
/* dossier raconte en chapitres : un temps de texte, un temps d'images */
function recit(p){
  const all=[],mob=innerWidth<700;
  let h=tete(p.k,p.t,p.c,["focus","Tous les dossiers"]);
  if(p.hero){all.push(p.hero);h+=`<a href="#" data-lb="0"><img class="plein-img ok" src="i/${p.hero[0]}.webp" width="${p.hero[1]}" height="${p.hero[2]}" alt="${esc(p.t)}"></a>`}
  h+=`<div class="wrap">`;
  if(p.chiffres.length)h+=`<div class="chiffres">${p.chiffres.map(c=>`<div><b>${esc(c[0])}</b><span>${esc(c[1])}</span></div>`).join("")}</div>`;
  h+=`<div class="somm" role="navigation" aria-label="Chapitres">${p.recit.filter(b=>b.n).map(b=>`<button type="button" data-go="ch-${b.n}"><b>${b.n}</b> ${esc(b.k)}</button>`).join("")}</div><div class="recit">`;
  p.recit.forEach(b=>{
    if(b.h){
      const corps=b.liste?`<ul>${b.liste.map(x=>`<li>${rich(x)}</li>`).join("")}</ul>`:b.x.map(para).join("");
      const liens=b.liens?`<p class="liens">${b.liens.map(lien).join("")}</p>`:"";
      h+=`<section class="sec chap"${b.n?` id="ch-${b.n}"`:""}><div class="num">${b.n?`<b>${b.n}</b>`:""}<span class="cap"><b>${esc(b.k)}</b>${b.d?" · "+esc(b.d):""}</span></div><div><h2>${rich(b.h)}</h2>${corps}${liens}</div></section>`;
    }else if(b.img){
      const s=all.length,n=b.img.length;b.img.forEach(x=>all.push(x));
      const cible=b.mur?0:mob?(b.pg&&b.img.some(q=>q[1]>q[2])?1:Math.min(2,n)):n;
      h+=`<figure class="phase${b.pg?" pg":""}">${rangs(b.img,s,cible,b.pg&&(mob||n<=2))}${b.leg?`<figcaption class="cap">${esc(b.leg)}</figcaption>`:""}</figure>`;
    }else if(b.liens_seuls){
      h+=`<p class="liens phase">${b.liens_seuls.map(lien).join("")}</p>`;
    }else if(b.films){
      h+=`<div class="films phase">${b.films.map((f,i)=>film({t:f[0],y:f[1],m:"",x:""},i+1)).join("")}</div>`;
    }
  });
  h+=`</div></div>`;
  const L=D.focus,n=L[(L.indexOf(p)+1)%L.length];
  h+=`<div class="wrap bloc" style="margin-top:30px"><a class="lien" href="#${n.id}">Dossier suivant : ${esc(n.t)} →</a></div>`;
  app.innerHTML=h;lier(all);vignettes();
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const c=document.getElementById(b.dataset.go);if(c)c.scrollIntoView({behavior:"smooth",block:"start"})});
}
function focusItem(p){

  const gal=p.planche?[]:p.galerie; /* planche contact : vignettes sans visionneuse */
  const all=[...(p.hero?[p.hero]:[]),...gal,...p.plus.aff,...p.plus.couv];

  const sec=p.sections.map(([t,ps])=>{const liste=/produit|étapes|procédé/i.test(t)||ps.every(x=>x.startsWith("• "));
    return `<div class="sec"><h2>${esc(t)}</h2><div>${liste?`<ul>${ps.map(x=>`<li>${rich(x.replace(/^• /,""))}</li>`).join("")}</ul>`:ps.map(para).join("")}</div></div>`}).join("");

  if(p.poeme)h+=`<div class="wrap"><blockquote class="poeme">${p.poeme.map(l=>`<span>${esc(l)}</span>`).join("")}</blockquote></div>`;
  const nb0=all.length, nd0=nb0+((p.bandeau||[]).length);

    ? `<div class="bandeau">${p.bandeau.map((x,i)=>`<a href="#" data-lb="${nb0+i}">${img(x,"Affiche")}</a>`).join("")}</div>`
      + ((p.diplomes&&p.diplomes.length)?`<div class="bandeau dip">${p.diplomes.map((x,i)=>`<a href="#" data-lb="${nd0+i}">${img(x,"Remise des prix")}</a>`).join("")}</div>`:"")
    : p.chiffres.length ? `<div class="chiffres">${p.chiffres.map(c=>`<div><b>${esc(c[0])}</b><span>${esc(c[1])}</span></div>`).join("")}</div>` : "";
  h+=`<div class="wrap">${tete2}<div class="sections">${sec}</div></div>`;
  if(p.id==="f-spinomag"){h+=`<div class="wrap" style="margin-top:50px"><div class="mur">${D.edition.spinomag.map(s=>`<div><a href="#" data-doc="${esc(s.k)}">${img(s.c,"Spinomag "+s.t)}</a><div class="leg"><b>${esc(s.t)}</b><span>${esc(s.d)}</span></div></div>`).join("")}</div><p class="note">Cliquez sur une couverture pour feuilleter le numéro.</p></div>`;app.innerHTML=h;return}
  if(p.galerie.length)h+=`<div class="wrap">${p.grille
    ? `<div class="grille" style="grid-template-columns:repeat(${p.grille},1fr)">${p.galerie.map((x,i)=>p.planche?`<div>${img(x,p.t)}</div>`:`<a href="#" data-lb="${g0+i}">${img(x,p.t)}</a>`).join("")}</div>`
    : rangs(p.galerie,g0)}</div>`;
  if(p.plus.aff.length)h+=`<div class="wrap bloc"><div class="tete"><h2 class="h2b">Affiches et panneaux</h2></div><div class="mur">${p.plus.aff.map((x,i)=>`<a href="#" data-lb="${a0+i}">${img(x,"Affiche")}</a>`).join("")}</div></div>`;
  if(p.plus.couv.length)h+=`<div class="wrap bloc"><div class="tete"><h2 class="h2b">Dans le Spinomag</h2></div><div class="mur">${p.plus.couv.map((x,i)=>`<a href="#" data-lb="${c0+i}">${img(x,"Couverture du Spinomag")}</a>`).join("")}</div></div>`;
  if(p.plus.films.length)h+=`<div class="wrap bloc"><div class="tete"><h2 class="h2b">En vidéo</h2></div><div class="films">${p.plus.films.map((f,i)=>film({t:f[0],y:f[1],m:"",x:""},i+1)).join("")}</div></div>`;
  app.innerHTML=h;lier(all.concat(p.bandeau||[],p.diplomes||[]));

/* ---------- édition ---------- */
const EDT={spinomag:["Spinomag","Le magazine de la Ville","Six numéros par an, 32 pages, 5 200 exemplaires : ligne éditoriale, rédaction, mise en page, photographie et suivi de fabrication. Cliquez sur une couverture pour feuilleter le numéro, page par page."],
 saison:["Saison culturelle","Brochures de la MAC","Chaque année, la brochure de saison donne le ton de la Maison des Arts et de la Culture : une illustration de couverture déclinée ensuite sur toutes les affiches de l'année."],
 guides:["Guides thématiques","Guides et livrets","Petite enfance, enfance et jeunesse, seniors, logement, nature, nouveaux arrivants, associations : les guides pratiques de la Ville, conçus, écrits et mis en page au service."],
 voeux:["Cartes de vœux","Vœux du maire","Les cartes de vœux de la Ville, une par année."],
 affiches:["Affiches","Affiches et panneaux","Spectacles, expositions, fêtes de la ville, commémorations, seniors, jeunesse, travaux, grands projets : les affiches, panneaux et couvertures conçus pour la Ville d'Épinay-sous-Sénart depuis 2019, des plus récents aux plus anciens."]};
function edition(k){

  else if(k==="voeux"){corps=rangs(E.voeux,0)}
  else{corps=`<div class="mur">${E[k].map(s=>`<div><a href="#" data-doc="${esc(s.k)}">${img(s.c,s.t)}</a><div class="leg"><b>${esc(s.t)}</b><span>${esc(s.d)}${s.d?" · ":""}${s.n} pages</span></div></div>`).join("")}</div>`}
  app.innerHTML=tete(cap,titre,lede)+
   `<div class="wrap"><div class="onglets">${E.onglets.map(o=>`<a href="#ed-${o[0]}" class="${o[0]===k?"on":""}">${esc(o[1])}</a>`).join("")}</div>

/* ---------- photo ---------- */
function photo(k){
  k=k||"spectacles";const R=D.rub[k];
  app.innerHTML=tete("Photographie",R.label,R.lede)+`<div class="wrap"><div class="onglets">${["spectacles","visites","series"].map(x=>`<a href="#${x}" class="${x===k?"on":""}">${esc(D.rub[x].label)}</a>`).join("")}</div>
  <div class="fiches">${R.items.map(o=>`<a class="fi" href="#${o.id}"><div class="im">${img(o.p[0],o.t)}</div><div class="l"><h3>${esc(o.t)}</h3><span class="cap">${esc(o.d)}</span></div></a>`).join("")}</div></div>`;

const LIE={"v-anru":["f-renovation","Le dossier : rénovation urbaine de La Plaine"],"v-suivi-des-travaux-cdc-habitat":["f-renovation","Le dossier : rénovation urbaine de La Plaine"],"v-territoire-zero-chomeur":["f-tzcld","Le dossier : Territoire zéro chômeur de longue durée"],"v-stephane-viry":["f-tzcld","Le dossier : Territoire zéro chômeur de longue durée"],"v-fabienne-balussou":["f-geothermie","Le dossier : la géothermie"],"v-inauguration-de-la-mac":["f-mac","Le dossier : la Maison des Arts et de la Culture"]};
function fiche(o,k){
  const R=D.rub[k], reste=o.p.slice(1);
  let h=tete(R.kicker+(o.d?" · "+o.d:""),o.t,o.x[0]||"",[k,R.label]);
  h+=`<a href="#" data-lb="0"><img class="plein-img ok" src="i/${o.p[0][0]}.webp" width="${o.p[0][1]}" height="${o.p[0][2]}" alt="${esc(o.t)}"></a>`;
  if(k==="visites"){
    /* reperes (date, personnalites), puis un temps de texte, un temps d'images */
    const qui=o.w&&o.w.toLowerCase()!==o.t.toLowerCase()?o.w.split(/\s*;\s*/).filter(Boolean):[];
    const T=o.x.slice(1), n=Math.max(1,T.length), par=Math.ceil(reste.length/n);
    h+=`<div class="wrap" style="margin-top:40px">`;
    if(o.d||qui.length)h+=`<div class="reperes">${o.d?`<span class="cap"><b>${esc(o.d)}</b></span>`:""}${qui.map(q=>`<span>${esc(q)}</span>`).join("")}</div>`;
    h+=`<div class="visite">`;
    for(let i=0;i<n;i++){
      if(T[i])h+=`<div class="col">${para(T[i])}</div>`;
      const g=reste.slice(i*par,i===n-1?reste.length:(i+1)*par);
      if(g.length)h+=`<div class="phase">${rangs(g,1+i*par,innerWidth<700?Math.min(2,g.length):g.length)}</div>`;
    }
    h+=`</div>${LIE[o.id]?`<p class="liens phase" style="margin-top:34px">${lien(["#"+LIE[o.id][0],LIE[o.id][1]].reverse())}</p>`:""}</div>`;
  }else{
    h+=`<div class="wrap" style="margin-top:40px">${o.w&&o.w.toLowerCase()!==o.t.toLowerCase()?`<p class="cap" style="margin-bottom:18px">${esc(o.w)}</p>`:""}<div class="col">${o.x.slice(1).map(para).join("")}</div>${rangs(reste,1,reste.length<=4?2:0)}</div>`;
  }
  const L=R.items,i=L.indexOf(o),n=L[(i+1)%L.length];
  h+=`<div class="wrap bloc"><a class="lien" href="#${n.id}">Suivant : ${esc(n.t)} →</a></div>`;
  app.innerHTML=h;lier(o.p);
}

  if(o.p.length>1)h+=rangs(o.p.slice(1),1,2);
  h+=`</div>`;
  if(o.films.length)h+=`<div class="wrap bloc"><div class="tete"><h2 class="h2b">En vidéo</h2></div><div class="films">${o.films.map((f,i)=>film({t:f[0],y:f[1],m:"",x:""},i+1)).join("")}</div></div>`;
  const L=D.ia,i=L.indexOf(o),n=L[(i+1)%L.length];
  h+=`<div class="wrap bloc"><a class="lien" href="#${n.id}">Suivant : ${esc(n.t)} →</a></div>`;
  app.innerHTML=h;lier(o.p);
}

/* ---------- routeur ---------- */
const IDX={};for(const k in D.rub)D.rub[k].items.forEach(o=>IDX[o.id]=[o,k]);
const FX={};D.focus.forEach(p=>FX[p.id]=p);
const IAX={};D.ia.forEach(o=>IAX[o.id]=o);
function route(){
  const h=(location.hash||"#accueil").slice(1);clearInterval(window._h);
  let sec=h;
  if(FX[h]){focusItem(FX[h]);sec="focus"}
  else if(IAX[h]){iaItem(IAX[h]);sec="ia"}
  else if(IDX[h]){fiche(...IDX[h]);sec="photo"}
  else if(h==="focus"||h==="projets"){focus();sec="focus"}
  else if(h==="edition"){edition("spinomag")}
  else if(h.startsWith("ed-")){edition(h.slice(3));sec="edition"}
  else if(h==="affiches"){edition("affiches");sec="edition"}
  else if(h==="photo"){photo("spectacles")}
  else if(D.rub[h]){photo(h);sec="photo"}
  else if(h==="ia"){ia()}
  else if(h==="video"){video()}
  else if(h==="archives"){archives()}
  else if(h==="a-propos"){apropos()}
  else{accueil();sec="accueil"}
  $("#menu").innerHTML=MENU.map(m=>`<a href="#${m[0]}" class="${m[0]===sec?"on":""}">${m[1]}</a>`).join("");
  $("#menu").classList.remove("ouvert");$("#burger").setAttribute("aria-expanded","false");$("#lb").classList.remove("on");fermerFilm&&$("#vb").classList.remove("on");$("#vb .cadre").innerHTML="";
  scrollTo(0,0);hydrate();
}
$("#burger").onclick=()=>{const o=$("#menu").classList.toggle("ouvert");$("#burger").setAttribute("aria-expanded",o);$("#burger").textContent=o?"Fermer":"Menu"};
addEventListener("hashchange",route);
addEventListener("scroll",()=>$("#hd").classList.toggle("plein",scrollY>60),{passive:true});
let rz;addEventListener("resize",()=>{clearTimeout(rz);const w=innerWidth;rz=setTimeout(()=>{
  if((w<700)!==(window._w<700)){ouvert()?aRouter=true:route()}
  window._w=w},200)});window._w=innerWidth;
route();
</script>
